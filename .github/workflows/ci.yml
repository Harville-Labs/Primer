name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancels superseded runs, except on main: cancelling a run mid-deploy can
  # leave Pages serving a half-published site.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      # The chart policy tests render the chart with `helm template` and read
      # the result. Without helm on the runner they skip, and a skipped
      # security test guards nothing while still reporting green.
      - uses: azure/setup-helm@v4

      # The MCP tool integration lives in the optional `tools` group, so a
      # type check without it cannot resolve the import and fails on code
      # that is fine. Tests need it for the same reason.
      - name: Sync workspace
        run: uv sync --all-packages --locked --group tools

      # Docling downloads its layout models on first conversion. Caching them
      # on the lock file keeps PDF parsing tested on every run without half a
      # gigabyte of downloads each time. A cache miss is slow, not broken.
      - name: Cache Docling models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: docling-models-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: docling-models-${{ runner.os }}-

      # The schemas the web app's types are generated from. Regenerating and
      # diffing catches a contract that changed while the checked-in copy
      # did not - which is the whole reason they are checked in.
      - name: Regenerate the OpenAPI schemas
        run: uv run python scripts/dump_openapi.py

      - name: Check the schemas are current
        run: git diff --exit-code -- schemas/

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest

  docs:
    name: Docs (generated, strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages --locked --group docs

      # The diagrams are generated. Regenerating them and diffing catches the
      # case where code changed and the picture of it did not. The HTTP
      # reference is not generated here at all - each service serves its own,
      # so there is nothing to keep in step.
      - name: Regenerate generated pages
        run: uv run python scripts/generate_diagrams.py

      - name: Check generated docs are current
        run: git diff --exit-code -- docs/

      - name: Build site
        run: uv run mkdocs build --strict

      # Uploaded from every run so a pull request proves the artefact builds,
      # but only the deploy job below is gated on main.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish-docs:
    name: Docs (publish)
    needs: docs
    # Only from main, and only for this repository: a fork running this
    # workflow has no Pages site to publish to and would fail confusingly.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      # Required by the deploy action to mint its OIDC token; it is scoped to
      # this job alone rather than granted to the whole workflow.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  chart:
    name: Chart (lint, render, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint deploy/helm/primer

      # Rendering with the values a real install needs, so a template error
      # or a missing `required` fails here rather than at install time.
      - name: Render
        run: |
          helm template primer deploy/helm/primer \
            --set postgresql.existingSecret=primer-postgres \
            --set rabbitmq.existingSecret=primer-rabbitmq \
            --set auth.oidc.issuerUrl=https://idp.example.com/ \
            --set auth.oidc.clientId=primer \
            --set auth.oidc.existingSecret=primer-oidc \
            --set inference.chat.baseUrl=http://model/v1 \
            --set inference.chat.model=chat-model \
            --set inference.embeddings.baseUrl=http://model/v1 \
            --set inference.embeddings.model=embed-model \
            > /dev/null

      - name: Package
        run: helm package deploy/helm/primer --destination dist

  images:
    # `latest` is main, and only main. A release publishes its own version
    # and moves no alias, so `latest` never silently becomes a release and a
    # release never silently becomes `latest`.
    #
    # Two architectures, each built on a runner of its own architecture
    # rather than emulated. The worker image carries torch and Docling, and
    # cross-building those under QEMU takes long enough that nobody would
    # keep it - and a cross-build that quietly falls back to compiling from
    # source is worse than not offering the platform at all.
    #
    # Each build pushes by digest and the job after this one stitches the
    # digests into a single manifest. Tagging them here would leave whichever
    # architecture finished last holding the name on its own.
    name: Images (build, publish latest)
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: primer-api
            dockerfile: deploy/images/Dockerfile.python
          - name: primer-worker
            dockerfile: deploy/images/Dockerfile.worker
          - name: primer-web
            dockerfile: deploy/images/Dockerfile.gui
        platform:
          - key: amd64
            id: linux/amd64
            runner: ubuntu-latest
          - key: arm64
            id: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pull request builds and throws the result away. It is here to prove
      # the image still builds on this architecture, which is the thing that
      # breaks.
      - name: Build
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.id }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.key }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.key }}

      - name: Build and push by digest
        id: build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.id }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          # What is in the image, and what built it. Attached to the image
          # rather than published beside it, so the question can be answered
          # from the registry without pulling anything.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.key }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.key }}

      - name: Hand the digest to the manifest job
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Named by the bare hex, because the manifest job puts it back
          # together as `image@sha256:<name>`.
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.key }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    # One tag over both architectures. Until this runs, the digests pushed
    # above are in the registry and nothing points at them.
    name: Images (publish manifest)
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [primer-api, primer-worker, primer-web]
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Create the manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # A manifest built from every digest this run produced. Missing one
          # would publish a tag that serves one architecture and fails on the
          # other, which is worse than not publishing it.
          test "$(ls -1 | wc -l)" -eq 2

          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@sha256:%s ' *)

      - name: Show what was published
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest"

  scan:
    # Every push and every pull request, against a threshold written down in
    # docs/operations/images.md. A policy nobody agreed to is a policy that
    # gets waived the first time it fires.
    name: Images (scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: primer-api
            dockerfile: deploy/images/Dockerfile.python
          - name: primer-worker
            dockerfile: deploy/images/Dockerfile.worker
          - name: primer-web
            dockerfile: deploy/images/Dockerfile.gui
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Built here rather than pulled, so a pull request is scanned before it
      # merges rather than after it ships. One architecture: the packages are
      # the same on both, and scanning is about what is installed.
      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: scan/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}-amd64

      - name: Scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: scan/${{ matrix.name }}:${{ github.sha }}
          format: table
          exit-code: 1
          # The threshold. Only what someone can actually act on: an
          # unfixed CVE in a base image is a thing to know about, not a
          # reason to block a change that has nothing to do with it.
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
        env:
          # The database moved to GHCR and the public rate limit is low
          # enough to fail a busy day. Authenticated pulls are not.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Web (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generated from the schemas checked in above, and diffed for the same
      # reason: a contract the web app has not followed should fail here
      # rather than in production. Node only, because the schemas are a file
      # rather than a running service.
      - name: Regenerate the API types
        run: pnpm run generate:api

      - name: Check the API types are current
        run: git diff --exit-code -- apps/web/src/lib/api/generated

      - name: Biome
        run: pnpm check

      - name: Svelte type check
        run: pnpm -r --if-present check

      - name: Tests
        run: pnpm test
