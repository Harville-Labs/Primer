name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancels superseded runs, except on main: cancelling a run mid-deploy can
  # leave Pages serving a half-published site.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      # The chart policy tests render the chart with `helm template` and read
      # the result. Without helm on the runner they skip, and a skipped
      # security test guards nothing while still reporting green.
      - uses: azure/setup-helm@v4

      # The MCP tool integration lives in the optional `tools` group, so a
      # type check without it cannot resolve the import and fails on code
      # that is fine. Tests need it for the same reason.
      - name: Sync workspace
        run: uv sync --all-packages --locked --group tools

      # Docling downloads its layout models on first conversion. Caching them
      # on the lock file keeps PDF parsing tested on every run without half a
      # gigabyte of downloads each time. A cache miss is slow, not broken.
      - name: Cache Docling models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: docling-models-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: docling-models-${{ runner.os }}-

      # The schemas the web app's types are generated from. Regenerating and
      # diffing catches a contract that changed while the checked-in copy
      # did not - which is the whole reason they are checked in.
      - name: Regenerate the OpenAPI schemas
        run: uv run python scripts/dump_openapi.py

      - name: Check the schemas are current
        run: git diff --exit-code -- schemas/

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest

  docs:
    name: Docs (generated, strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages --locked --group docs

      # The diagrams are generated. Regenerating them and diffing catches the
      # case where code changed and the picture of it did not. The HTTP
      # reference is not generated here at all - each service serves its own,
      # so there is nothing to keep in step.
      - name: Regenerate generated pages
        run: uv run python scripts/generate_diagrams.py

      - name: Check generated docs are current
        run: git diff --exit-code -- docs/

      - name: Build site
        run: uv run mkdocs build --strict

      # Uploaded from every run so a pull request proves the artefact builds,
      # but only the deploy job below is gated on main.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish-docs:
    name: Docs (publish)
    needs: docs
    # Only from main, and only for this repository: a fork running this
    # workflow has no Pages site to publish to and would fail confusingly.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      # Required by the deploy action to mint its OIDC token; it is scoped to
      # this job alone rather than granted to the whole workflow.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  lab-graphs:
    # The graph builder has its own lock (ADR 0009), so the workspace job
    # neither installs it nor runs its tests. Without this they would never run.
    name: Lab graph builder (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/lab-graphs
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/lab-graphs/uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Sync the builder
        run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest tests -q

  chart:
    name: Chart (lint, render, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint deploy/helm/primer

      # Rendering with the values a real install needs, so a template error
      # or a missing `required` fails here rather than at install time.
      # Twice: once as an install comes up out of the box, with the bundled
      # embedder, and once pointed at an embedding server the operator runs.
      - name: Render
        run: |
          install=(
            --set postgresql.existingSecret=primer-postgres
            --set rabbitmq.existingSecret=primer-rabbitmq
            --set auth.oidc.issuerUrl=https://idp.example.com/
            --set auth.oidc.clientId=primer
            --set auth.oidc.existingSecret=primer-oidc
            --set inference.chat.baseUrl=http://model/v1
            --set inference.chat.model=chat-model
          )
          helm template primer deploy/helm/primer "${install[@]}" > /dev/null
          helm template primer deploy/helm/primer "${install[@]}" \
            --set inference.embeddings.bundled.enabled=false \
            --set inference.embeddings.baseUrl=http://model/v1 \
            --set inference.embeddings.model=embed-model \
            > /dev/null

      - name: Package
        run: helm package deploy/helm/primer --destination dist

  images:
    # Only from main. A pull request builds no image: the arm64 builds of
    # the worker and Lab cost more runner time than every other job here put
    # together, and a pull request could not publish what it built anyway.
    # The price is that a change which breaks a Dockerfile fails here, after
    # it merges, rather than in review.
    #
    # Two architectures, each built on a runner of its own architecture
    # rather than emulated. The worker image carries torch and Docling, and a
    # cross-build of those under QEMU is slow enough that nobody would keep
    # it.
    #
    # Each build pushes by digest and `manifest` names them. A tag applied
    # here would be claimed by whichever architecture finished last, and
    # would serve that one alone.
    name: Images (build)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - primer-api
          - primer-worker
          - primer-web
          - primer-lab
          - primer-lab-cuda
          - primer-lab-graphs
        # Lab's CUDA builds too: PyTorch publishes CUDA wheels for aarch64,
        # and an arm64 GPU machine such as a DGX Spark has no amd64 image to
        # fall back on.
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
          - variant: primer-api
            image: primer-api
            dockerfile: deploy/images/Dockerfile.python
          - variant: primer-worker
            image: primer-worker
            dockerfile: deploy/images/Dockerfile.worker
          - variant: primer-web
            image: primer-web
            dockerfile: deploy/images/Dockerfile.gui
          # Lab three times, from one Dockerfile: the CPU build under the
          # plain tags, the CUDA build under the same tags with `-cuda`,
          # which is what the chart's lab.gpu switches to, and the CUDA
          # build with the graph builder beside it under `-graphs`, which
          # lab.graphs.enabled switches to.
          - variant: primer-lab
            image: primer-lab
            dockerfile: deploy/images/Dockerfile.lab
            target: cpu
          - variant: primer-lab-cuda
            image: primer-lab
            dockerfile: deploy/images/Dockerfile.lab
            target: cuda
          - variant: primer-lab-graphs
            image: primer-lab
            dockerfile: deploy/images/Dockerfile.lab
            target: graphs
    steps:
      # The CUDA images hold torch's CUDA wheels, twice over in the graphs
      # image, and buildx needs room for the layers, the cache export and
      # the SBOM scan at once. That is more than a hosted runner has free:
      # the graphs build has failed with no space left on the device. The
      # runner's preinstalled SDKs are about 25 GB that nothing here uses.
      - name: Free disk space
        if: matrix.target == 'cuda' || matrix.target == 'graphs'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry path must be lowercase and the owner is Harville-Labs.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      # For the labels. The tags are applied by `manifest`.
      - name: Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # What is in the image, and what built it. Attached to the image
          # rather than published beside it, so the question can be answered
          # from the registry without pulling anything.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.platform }}

      # Named by architecture, so `manifest` knows which one to scan.
      - name: Hand the digest to the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.platform }}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    # Scans each build, then names it: `latest`, and `sha-<commit>` for
    # pinning one build and for a release to name later. The tags are moved
    # only after the scan passes, so neither `latest` nor a release can point
    # at an image the policy in docs/operations/images.md refused.
    #
    # `needs` is what makes this all or nothing. If any build failed this
    # job does not run, so no tag is moved onto an image missing an
    # architecture, or onto the API while the worker is a commit behind.
    name: Images (scan, publish)
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: primer-api
            image: primer-api
          - variant: primer-worker
            image: primer-worker
          - variant: primer-web
            image: primer-web
          - variant: primer-lab
            image: primer-lab
          - variant: primer-lab-cuda
            image: primer-lab
            suffix: -cuda
          - variant: primer-lab-graphs
            image: primer-lab
            suffix: -graphs
    steps:
      # For .trivyignore, which the scan reads from the workspace.
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.variant }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate the builds
        id: ref
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "amd64=$(cat "$RUNNER_TEMP/digests/amd64")" >> "$GITHUB_OUTPUT"

      # One architecture: the packages are the same on both, and the scan is
      # about what is installed.
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}@${{ steps.ref.outputs.amd64 }}
          format: table
          exit-code: 1
          # The threshold. Only what someone can actually act on: an
          # unfixed CVE in a base image is a thing to know about, not a
          # reason to block a change that has nothing to do with it.
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
        env:
          # The vulnerability database is on GHCR, and the anonymous rate
          # limit is low enough to fail a busy day.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ref.outputs.image }}
          # `onlatest`, because the suffix is otherwise left off `latest`,
          # and every Lab build would claim it.
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Create the manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          sources=()
          for platform in *; do
            sources+=("${IMAGE}@$(cat "$platform")")
          done
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${sources[@]}"
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

  web:
    name: Web (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generated from the schemas checked in above, and diffed for the same
      # reason: a contract the web app has not followed should fail here
      # rather than in production. Node only, because the schemas are a file
      # rather than a running service.
      - name: Regenerate the API types
        run: pnpm run generate:api

      - name: Check the API types are current
        run: git diff --exit-code -- apps/web/src/lib/api/generated

      - name: Biome
        run: pnpm check

      - name: Svelte type check
        run: pnpm -r --if-present check

      - name: Tests
        run: pnpm test

      # The web image ships the adapter's bundle with no node_modules, so the
      # image scan finds no npm packages to check: what the server bundles is
      # checked here, from the lockfile, instead. Every package is a
      # devDependency (see tests/repo/test_deploy_images.py), and Trivy skips those
      # unless told otherwise - without the variable this scans nothing and
      # passes. That makes it a superset: build tools fail it too.
      - name: Scan the web dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: pnpm-lock.yaml
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
        env:
          TRIVY_INCLUDE_DEV_DEPS: true
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
