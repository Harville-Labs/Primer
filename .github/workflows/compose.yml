name: Compose

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    # The one job that runs Primer as it ships: the API, worker and web
    # images built from this change, started together by Compose, and a
    # document taken through every stage of ingestion. The policy tests read
    # the Compose file; only this finds a stage that strands, a service that
    # cannot reach another, or a Dockerfile that no longer builds - before
    # merge, which CI's `images` job cannot.
    #
    # amd64 only, and Lab not at all: those are the expensive builds, and
    # CI's `images` job still builds them from main.
    name: Compose (build, end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v5

      # Generated per run and never printed. The reranker is left out: the
      # smoke test does not search, and it is a second model download.
      - name: Credentials
        run: |
          umask 077
          for name in POSTGRES_PASSWORD RABBITMQ_PASSWORD PRIMER_GRAPH_PASSWORD \
            PRIMER_INTERNAL_API_TOKEN PRIMER_WORKER_TOKEN; do
            echo "$name=$(openssl rand -hex 24)" >> .env
          done
          echo "PRIMER_RERANK_BASE_URL=" >> .env

      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 1500

      - name: Take a document through ingestion
        run: deploy/compose/scripts/smoke.sh

      # Services log no content or credentials at info, so the tail is safe
      # to show and is the first thing anyone debugging this will want.
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200
