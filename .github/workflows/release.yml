# Publishing a release.
#
# Everything a release produces is named by the release's own tag: the
# images and the chart, all with one version, so an operator installing
# `primer 1.4.0` gets the images that were built from the commit tagged
# v1.4.0.
#
# `latest` is not touched here. It is published by CI from main and means
# exactly that - the tip of the branch - so nobody can install a release by
# accident, or a development build by asking for the newest release. The
# chart is published only from here for the same reason: there is no such
# thing as an unversioned install.
#
# This does not re-run the test suite or build anything. The tag names a
# commit that CI already checked, built, and scanned on main; tagging
# something that never passed is the one way to publish broken images from
# here.
name: Release

on:
  release:
    types: [published]
  # For re-publishing a tag whose run failed part way, which otherwise leaves
  # images pushed and no chart pointing at them.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v1.4.0
        required: true

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      minor: ${{ steps.resolve.outputs.minor }}
      stable: ${{ steps.resolve.outputs.stable }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Resolve the version
        id: resolve
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          set -euo pipefail

          # Helm chart versions must be SemVer, so a tag that is not one
          # cannot be released at all. Failing here says so, rather than
          # letting three images publish and the chart fail afterwards.
          version="${TAG#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version this can release. Tag as v1.2.3 or v1.2.3-rc.1." >&2
            # Build metadata is rejected on purpose rather than stripped: `+`
            # is not a legal character in an image tag, so `v1.2.3+build.5`
            # has no valid name to publish under and quietly renaming it
            # would produce a release nobody asked for.
            exit 1
          fi
          # From the captured numbers, not by trimming the string: trimming
          # `2.0.0-rc.1` yields `2.0.0-rc`, which is not a minor of anything.
          minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          # A prerelease keeps its exact version and nothing else. Moving
          # the minor alias onto it would hand it to everyone who asked for
          # the stable line.
          stable=true
          if [[ "$PRERELEASE" == "true" || "$version" == *-* ]]; then
            stable=false
          fi

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "minor=$minor"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $TAG as $version (stable: $stable)"

      # The tag, explicitly. A release event's ref is already the tag, but a
      # manual re-run's is not, and naming the wrong commit's images under a
      # release version is not a mistake that shows up later.
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Resolve the commit
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  images:
    # Named, not built. The images a release ships are the ones CI built
    # from the tagged commit on main, scanned, and tagged `sha-<commit>`;
    # this gives them the version's names. Building again here would ship
    # images nobody scanned, from a second build that can differ from the
    # first, and would cost the arm64 builds twice.
    #
    # So a release can only name a commit CI has published from main.
    name: Images
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: primer-api
            platforms: amd64 arm64
          - image: primer-worker
            platforms: amd64 arm64
          - image: primer-web
            platforms: amd64 arm64
          - image: primer-lab
            platforms: amd64 arm64
          - image: primer-lab
            suffix: -cuda
            platforms: amd64 arm64
          - image: primer-lab
            suffix: -graphs
            platforms: amd64 arm64
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the build
        env:
          COMMIT: ${{ needs.version.outputs.commit }}
          VERSION: ${{ needs.version.outputs.version }}
          MINOR: ${{ needs.version.outputs.minor }}
          STABLE: ${{ needs.version.outputs.stable }}
          SUFFIX: ${{ matrix.suffix }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          source="${image}:sha-${COMMIT}${SUFFIX}"

          if ! docker buildx imagetools inspect "$source" > /dev/null; then
            echo "::error::${source} does not exist. CI publishes images only from main, so the tag must name a commit on main whose 'Images' jobs passed. Re-run them for that commit, or tag one that has them." >&2
            exit 1
          fi

          # The minor alias only for a stable release; a prerelease keeps
          # its exact version and nothing else.
          tags=(-t "${image}:${VERSION}${SUFFIX}")
          if [[ "$STABLE" == "true" ]]; then
            tags+=(-t "${image}:${MINOR}${SUFFIX}")
          fi
          docker buildx imagetools create "${tags[@]}" "$source"

          # Against the registry, not against what this step believes it
          # did: every platform the build promises is under the new name.
          published="$(docker buildx imagetools inspect "${image}:${VERSION}${SUFFIX}")"
          echo "$published"
          for platform in $PLATFORMS; do
            if ! grep -q "linux/${platform}" <<< "$published"; then
              echo "::error::${image}:${VERSION}${SUFFIX} has no linux/${platform} image." >&2
              exit 1
            fi
          done

  chart:
    name: Chart
    # After the images, never beside them. The chart's appVersion is what
    # picks an image tag, so publishing it first would offer an install that
    # pulls tags nothing has pushed yet.
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint deploy/helm/primer

      # `--app-version` is the part that matters: every image tag in the
      # chart defaults to it, so one flag points the whole release at the
      # images this run just built.
      - name: Package
        run: |
          helm package deploy/helm/primer \
            --version "${{ needs.version.outputs.version }}" \
            --app-version "${{ needs.version.outputs.version }}" \
            --destination dist

      # As an install comes up out of the box, with the bundled embedder. An
      # embedding baseUrl here as well is refused by the chart, which is
      # what failed v1.0.1's first run.
      #
      # The image is matched by its whole path, not only its tag: when the
      # repository moved to the organisation, images went with it and the
      # chart's defaults did not, so 1.1.0 installed images that were never
      # pushed where it looked.
      - name: Check the packaged chart renders
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm template primer "dist/primer-${{ needs.version.outputs.version }}.tgz" \
            --set postgresql.existingSecret=primer-postgres \
            --set rabbitmq.existingSecret=primer-rabbitmq \
            --set auth.oidc.issuerUrl=https://idp.example.com/ \
            --set auth.oidc.clientId=primer \
            --set auth.oidc.existingSecret=primer-oidc \
            --set inference.chat.baseUrl=http://model/v1 \
            --set inference.chat.model=chat-model \
            | grep -q "ghcr.io/${owner}/primer-api:${{ needs.version.outputs.version }}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm push "dist/primer-${{ needs.version.outputs.version }}.tgz" \
            "oci://ghcr.io/${owner}/charts"
