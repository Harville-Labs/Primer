# Publishing a release.
#
# Everything a release produces is named by the release's own tag: the three
# images and the chart, all with one version, so an operator installing
# `primer 1.4.0` gets the images that were built from the commit tagged
# v1.4.0.
#
# `latest` is not touched here. It is published by CI from main and means
# exactly that - the tip of the branch - so nobody can install a release by
# accident, or a development build by asking for the newest release. The
# chart is published only from here for the same reason: there is no such
# thing as an unversioned install.
#
# This does not re-run the test suite. The tag names a commit that CI already
# checked on main; tagging something that never passed is the one way to
# publish broken images from here.
name: Release

on:
  release:
    types: [published]
  # For re-publishing a tag whose run failed part way, which otherwise leaves
  # images pushed and no chart pointing at them.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v1.4.0
        required: true

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      minor: ${{ steps.resolve.outputs.minor }}
      stable: ${{ steps.resolve.outputs.stable }}
    steps:
      - name: Resolve the version
        id: resolve
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          set -euo pipefail

          # Helm chart versions must be SemVer, so a tag that is not one
          # cannot be released at all. Failing here says so, rather than
          # letting three images publish and the chart fail afterwards.
          version="${TAG#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version this can release. Tag as v1.2.3 or v1.2.3-rc.1." >&2
            # Build metadata is rejected on purpose rather than stripped: `+`
            # is not a legal character in an image tag, so `v1.2.3+build.5`
            # has no valid name to publish under and quietly renaming it
            # would produce a release nobody asked for.
            exit 1
          fi
          # From the captured numbers, not by trimming the string: trimming
          # `2.0.0-rc.1` yields `2.0.0-rc`, which is not a minor of anything.
          minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          # A prerelease keeps its exact version and nothing else. Moving
          # the minor alias onto it would hand it to everyone who asked for
          # the stable line.
          stable=true
          if [[ "$PRERELEASE" == "true" || "$version" == *-* ]]; then
            stable=false
          fi

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "minor=$minor"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $TAG as $version (stable: $stable)"

  images:
    # Two architectures, each on a runner of its own architecture. Pushed by
    # digest and named in the job after this one: a tag that arrived while
    # only one architecture had finished would serve that one and fail on the
    # other, and a release is the worst place to find that out.
    name: Images
    needs: version
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: primer-api
            dockerfile: deploy/images/Dockerfile.python
          - name: primer-worker
            dockerfile: deploy/images/Dockerfile.worker
          - name: primer-web
            dockerfile: deploy/images/Dockerfile.gui
        platform:
          - key: amd64
            id: linux/amd64
            runner: ubuntu-latest
          - key: arm64
            id: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      # The tag, explicitly. A release event's ref is already the tag, but a
      # manual re-run's is not, and building the wrong commit under a release
      # version is not a mistake that shows up later.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.id }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          # What is in a released image is a question an operator is entitled
          # to answer from the registry, without pulling it first.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.key }}

      - name: Hand the digest to the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Named by the bare hex, because the manifest job puts it back
          # together as `image@sha256:<name>`.
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.key }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    # The version, and the minor line it is the newest of. Not `latest`: that
    # belongs to main, and moving it here would make the newest build of
    # Primer and the newest release of Primer the same name for two different
    # things.
    name: Manifest
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [primer-api, primer-worker, primer-web]
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ needs.version.outputs.stable == 'true' }}

      - name: Create the manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # Both architectures, or nothing published under this version.
          test "$(ls -1 | wc -l)" -eq 2

          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@sha256:%s ' *)

      - name: Check both architectures are there
        run: |
          set -euo pipefail
          # The acceptance test for the whole thing, run against the registry
          # rather than against what this workflow believes it pushed.
          raw=$(docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.version.outputs.version }}" \
            --raw)
          for architecture in amd64 arm64; do
            jq -e --arg a "$architecture" \
              '[.manifests[].platform.architecture] | index($a)' <<< "$raw" > /dev/null \
              || { echo "::error::${{ matrix.image }} has no $architecture" >&2; exit 1; }
          done
          echo "$raw" | jq '[.manifests[].platform]'

  chart:
    name: Chart
    # After the manifests, never beside them. The chart's appVersion is what
    # picks an image tag, so publishing it first would offer an install that
    # pulls tags nothing has pushed yet - and until the manifest job runs the
    # images exist only as digests nothing points at.
    needs: [version, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint deploy/helm/primer

      # `--app-version` is the part that matters: every image tag in the
      # chart defaults to it, so one flag points the whole release at the
      # images this run just built.
      - name: Package
        run: |
          helm package deploy/helm/primer \
            --version "${{ needs.version.outputs.version }}" \
            --app-version "${{ needs.version.outputs.version }}" \
            --destination dist

      - name: Check the packaged chart renders
        run: |
          helm template primer "dist/primer-${{ needs.version.outputs.version }}.tgz" \
            --set postgresql.existingSecret=primer-postgres \
            --set rabbitmq.existingSecret=primer-rabbitmq \
            --set auth.oidc.issuerUrl=https://idp.example.com/ \
            --set auth.oidc.clientId=primer \
            --set auth.oidc.existingSecret=primer-oidc \
            --set inference.chat.baseUrl=http://model/v1 \
            --set inference.chat.model=chat-model \
            --set inference.embeddings.baseUrl=http://model/v1 \
            --set inference.embeddings.model=embed-model \
            | grep -q "primer-api:${{ needs.version.outputs.version }}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push
        run: |
          helm push "dist/primer-${{ needs.version.outputs.version }}.tgz" \
            oci://ghcr.io/${{ github.repository_owner }}/charts
