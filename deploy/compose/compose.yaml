# Primer, locally, for one person on one machine.
#
#   docker compose up --wait     # from the repository root
#
# The root compose.yaml includes this file. Starting it directly with -f
# works too, and then reads the `.env` in this directory instead.
#
# This profile has no authentication and is not meant to gain any. Every
# request is the same fixed local user, so anyone who can reach the
# published ports is that user. Bind it to localhost and keep it there.
#
# Multi-user Primer is the Kubernetes deployment. That is where the ingress,
# the identity provider, and the trusted-header boundary live; bolting a
# proxy onto Compose would produce something that looks multi-user while one
# forgotten published port makes authentication decorative.
#
# The embedding model and the reranker are bundled, so the stack can index
# and search as it comes. The chat model is yours: name an OpenAI-compatible
# endpoint - vLLM, Ollama, llama.cpp, or a hosted API - with
# PRIMER_CHAT_BASE_URL, or add one on the settings page. env.example says how
# to swap either bundled server for one of your own.

name: primer

x-python-image: &python-image
  build:
    context: ../..
    dockerfile: deploy/images/Dockerfile.python

x-hardening: &hardening
  read_only: true
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=256m,mode=1777
    - /home/primer:size=32m,mode=0700,uid=10001,gid=10001

# One URL for every database user. Setting PRIMER_DATABASE_URL points them
# all at your own PostgreSQL and leaves the bundled one stopped; unset, they
# use the bundled one, which then needs POSTGRES_PASSWORD. It is a plain
# postgresql:// URL, and each service picks its own driver from it.
x-database-url: &database-url ${PRIMER_DATABASE_URL:-postgresql://primer:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, or PRIMER_DATABASE_URL to use your own PostgreSQL}@postgres:5432/primer}

# Retrieval is not given this: it holds vectors in Qdrant and the graph in
# Neo4j, and a service with no use for the database should not hold its
# password.
x-service-env: &service-env
  PRIMER_DATABASE_URL: *database-url
  PRIMER_INTERNAL_API_TOKEN: ${PRIMER_INTERNAL_API_TOKEN:?set PRIMER_INTERNAL_API_TOKEN}
  PRIMER_SERVICE_TOKEN: ${PRIMER_INTERNAL_API_TOKEN:?set PRIMER_INTERNAL_API_TOKEN}
  PRIMER_SOURCE_STORE_URL: file:///var/lib/primer/sources

# The embedding model, said once: the bundled server loads it, Retrieval
# describes its vectors by it, and the parse worker cuts chunks with its
# tokenizer. Told different models, they disagree without failing.
x-embedding-model: &embedding-model ${PRIMER_EMBEDDING_MODEL:-onnx-community/Qwen3-Embedding-0.6B-ONNX}
x-rerank-model: &rerank-model ${PRIMER_RERANK_MODEL:-BAAI/bge-reranker-base}

# The bundled model servers: Text Embeddings Inference on CPU. The image is
# published for amd64 only (huggingface/text-embeddings-inference#648), so on
# Apple Silicon it runs emulated, and slowly; a native server of your own is
# faster there. The flags are the ones docs/operations/models.md explains:
# Primer sends 32 inputs per call, and a server accepting fewer refuses every
# batch.
x-model-server: &model-server
  <<: *hardening
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
  platform: linux/amd64
  user: "10001:10001"
  depends_on:
    init-volumes:
      condition: service_completed_successfully
  environment:
    # The image's home is not writable; the cache volume holds everything.
    HF_HOME: /data
    HUGGINGFACE_HUB_CACHE: /data
  # The first start downloads the model, which is minutes on a slow link.
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 15m
  restart: unless-stopped

# What both ingestion workers share; each adds the settings for its stages.
x-worker-env: &worker-env
  <<: *service-env
  PRIMER_BROKER_URL: amqp://primer:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672//
  PRIMER_CONTROL_URL: http://control:8000
  PRIMER_RETRIEVAL_URL: http://retrieval:8000

x-worker: &worker
  <<: *hardening
  build:
    context: ../..
    dockerfile: deploy/images/Dockerfile.worker
  depends_on:
    init-volumes:
      condition: service_completed_successfully
    control:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped

services:
  # Stopped when PRIMER_DATABASE_URL names your own server: the profile is
  # empty, so always on, until that variable gives it a name nobody enables.
  postgres:
    image: postgres:17
    profiles: ["${PRIMER_DATABASE_URL:+external-database}"]
    environment:
      POSTGRES_USER: primer
      # Empty rather than required, because Compose interpolates this
      # service even when it is off. The image refuses to start without one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: primer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primer -d primer"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: primer
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Migrations are a one-shot, never part of a service's startup: several
  # replicas racing to alter the same schema is exactly what this avoids.
  # Everything that touches the database waits for this to exit cleanly.
  migrate-control:
    <<: [*python-image, *hardening]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment:
      PRIMER_DATABASE_URL: *database-url
    working_dir: /app/services/control-api
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  migrate-chat:
    <<: [*python-image, *hardening]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment:
      PRIMER_DATABASE_URL: *database-url
    working_dir: /app/services/chat
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # The vector store. Stopped when PRIMER_QDRANT_URL names your own, the
  # same way the bundled PostgreSQL is. Not published: only Retrieval
  # talks to it. Its vectors are derived from your documents, so losing the
  # volume costs a reindex rather than anything only it holds.
  qdrant:
    image: qdrant/qdrant:v1.19.0
    profiles: ["${PRIMER_QDRANT_URL:+external-qdrant}"]
    environment:
      # On by default upstream, and it reports to Qdrant's servers.
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    # The image has no curl or wget, so this is bash opening the port.
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The knowledge graph, off unless the `graph` profile is enabled:
  #
  #   COMPOSE_PROFILES=graph
  #
  # Every graph variable below falls back to empty rather than being
  # required, because Compose interpolates the whole file whichever profiles
  # are on: `:?` here would refuse to start a stack that has no graph at all.
  # Neo4j itself refuses an empty password, so the profile still cannot run
  # without one.
  neo4j:
    image: neo4j:5.26-community
    profiles: [graph]
    environment:
      NEO4J_AUTH: neo4j/${PRIMER_GRAPH_PASSWORD:-}
    volumes:
      - graph-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7474"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  migrate-graph:
    <<: [*python-image, *hardening]
    profiles: [graph]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      PRIMER_GRAPH_URL: ${PRIMER_GRAPH_URL:-}
      PRIMER_GRAPH_PASSWORD: ${PRIMER_GRAPH_PASSWORD:-}
    command: ["python", "-m", "primer_retrieval.graph_schema"]
    restart: "no"

  # Lab, off unless the `lab` profile is enabled:
  #
  #   COMPOSE_PROFILES=lab
  #
  # It loads a small open model itself - Qwen3-1.7B unless PRIMER_LAB_MODEL
  # names another - and fetches the weights into `lab-models` the first time,
  # so the first start takes as long as that download. Nothing is fetched
  # ahead of time and nothing is evicted: the volume grows by one model per
  # model anyone chooses. On an NVIDIA GPU, add compose.gpu.yaml.
  #
  # Every variable falls back to empty for the same reason the graph's do,
  # and Lab reads an empty one as unset. No port is published: the web app
  # is what reaches it, as it is for Chat.
  lab:
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.lab
      target: cpu
    <<: *hardening
    profiles: [lab]
    environment:
      # Fixed, not configurable: see the note at the top of this file.
      PRIMER_AUTH_MODE: disabled
      PRIMER_LAB_MODEL: ${PRIMER_LAB_MODEL:-}
      PRIMER_LAB_MODEL_CHOICE: ${PRIMER_LAB_MODEL_CHOICE:-}
      PRIMER_LAB_REPOSITORY_PATTERNS: ${PRIMER_LAB_REPOSITORY_PATTERNS:-}
      PRIMER_LAB_MAX_MODEL_BYTES: ${PRIMER_LAB_MAX_MODEL_BYTES:-}
      PRIMER_LAB_SAES: ${PRIMER_LAB_SAES:-}
      PRIMER_LAB_HUB_ENDPOINT: ${PRIMER_LAB_HUB_ENDPOINT:-}
      PRIMER_LAB_DEVICE: ${PRIMER_LAB_DEVICE:-}
      PRIMER_LAB_DTYPE: ${PRIMER_LAB_DTYPE:-}
    volumes:
      - lab-models:/models
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Stopped when PRIMER_EMBEDDING_BASE_URL names your own server.
  embeddings:
    <<: *model-server
    profiles: ["${PRIMER_EMBEDDING_BASE_URL:+external-embeddings}"]
    # The default model's ONNX export carries no pooling config, and the
    # mean pooling TEI would otherwise pick retrieves badly.
    command:
      ["--model-id", *embedding-model, "--port", "8080",
       "--pooling", "${PRIMER_EMBEDDING_POOLING:-last-token}",
       "--max-batch-tokens", "4096", "--auto-truncate",
       "--max-client-batch-size", "32", "--max-concurrent-requests", "256"]
    volumes:
      - embedding-cache:/data

  # Stopped when PRIMER_RERANK_BASE_URL is set at all: to your own server's
  # URL, or to nothing to search without reranking. Hence `+`, not `:+`.
  reranker:
    <<: *model-server
    profiles: ["${PRIMER_RERANK_BASE_URL+external-reranker}"]
    # Tokenization workers are otherwise one per host core, each holding its
    # own copy of a 250k-entry vocabulary.
    command:
      ["--model-id", *rerank-model, "--port", "8080",
       "--max-batch-tokens", "4096", "--auto-truncate",
       "--max-client-batch-size", "32", "--max-concurrent-requests", "256",
       "--tokenization-workers", "4"]
    volumes:
      - rerank-cache:/data

  init-volumes:
    image: alpine
    restart: "no"
    volumes:
      - source-objects:/var/lib/primer/sources
      - model-cache:/var/cache/primer/huggingface
      - embedding-cache:/var/cache/primer/embeddings
      - rerank-cache:/var/cache/primer/reranker
    command: ["sh", "-c", "mkdir -p /var/lib/primer/sources/sources /var/lib/primer/sources/tmp && chown -R 10001:10001 /var/lib/primer/sources && chmod -R u+rwX /var/lib/primer/sources && mkdir -p /var/cache/primer/huggingface && chown -R 10001:10001 /var/cache/primer/huggingface /var/cache/primer/embeddings /var/cache/primer/reranker"]

  control:
    <<: [*python-image, *hardening]
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      migrate-control:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *service-env
      # Fixed, not configurable: see the note at the top of this file.
      PRIMER_AUTH_MODE: disabled
      PRIMER_BROKER_URL: amqp://primer:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672//
      PRIMER_CHAT_SERVICE_URL: http://chat:8000
      # Set with the lab profile; Compose cannot tell Control which profiles are on.
      PRIMER_LAB_SERVICE_URL: ${PRIMER_LAB_SERVICE_URL:-}
      PRIMER_MAX_UPLOAD_BYTES: ${PRIMER_MAX_UPLOAD_BYTES:-104857600}
    volumes:
      - source-objects:/var/lib/primer/sources
    command:
      ["uvicorn", "primer_control.app:create_app", "--factory",
       "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:${PRIMER_CONTROL_PORT:-8000}:8000"
    restart: unless-stopped

  retrieval:
    <<: [*python-image, *hardening]
    depends_on:
      qdrant:
        condition: service_healthy
        required: false
      # Not waited for when you name your own.
      embeddings:
        condition: service_healthy
        required: false
      reranker:
        condition: service_healthy
        required: false
      # Only waited for when the `graph` profile is on.
      migrate-graph:
        condition: service_completed_successfully
        required: false
    environment:
      PRIMER_INTERNAL_API_TOKEN: ${PRIMER_INTERNAL_API_TOKEN:?set PRIMER_INTERNAL_API_TOKEN}
      PRIMER_QDRANT_URL: ${PRIMER_QDRANT_URL:-http://qdrant:6333}
      PRIMER_QDRANT_API_KEY: ${PRIMER_QDRANT_API_KEY:-}
      PRIMER_QDRANT_LAYOUT: ${PRIMER_QDRANT_LAYOUT:-memory}
      PRIMER_EMBEDDING_BASE_URL: ${PRIMER_EMBEDDING_BASE_URL:-http://embeddings:8080/v1}
      PRIMER_EMBEDDING_MODEL: *embedding-model
      # Empty takes the width and prompts from Primer's table of known
      # models. Set them for a model it does not know.
      PRIMER_EMBEDDING_DIMENSIONS: ${PRIMER_EMBEDDING_DIMENSIONS:-}
      PRIMER_EMBEDDING_QUERY_PREFIX: ${PRIMER_EMBEDDING_QUERY_PREFIX:-}
      PRIMER_EMBEDDING_DOCUMENT_PREFIX: ${PRIMER_EMBEDDING_DOCUMENT_PREFIX:-}
      PRIMER_EMBEDDING_API_KEY: ${PRIMER_EMBEDDING_API_KEY:-}
      # Set but empty turns reranking off. A rerank URL has no /v1.
      PRIMER_RERANK_BASE_URL: ${PRIMER_RERANK_BASE_URL-http://reranker:8080}
      PRIMER_RERANK_MODEL: *rerank-model
      PRIMER_RERANK_API_KEY: ${PRIMER_RERANK_API_KEY:-}
      # The bundled reranker accepts at most 32 in one call.
      PRIMER_RERANK_CANDIDATES: ${PRIMER_RERANK_CANDIDATES:-20}
      # Empty turns the graph off; search answers from vectors alone.
      PRIMER_GRAPH_URL: ${PRIMER_GRAPH_URL:-}
      PRIMER_GRAPH_PASSWORD: ${PRIMER_GRAPH_PASSWORD:-}
    command:
      ["uvicorn", "primer_retrieval.app:create_app", "--factory",
       "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  chat:
    <<: [*python-image, *hardening]
    depends_on:
      migrate-chat:
        condition: service_completed_successfully
      retrieval:
        condition: service_healthy
    environment:
      <<: *service-env
      # Fixed, not configurable: see the note at the top of this file.
      PRIMER_AUTH_MODE: disabled
      PRIMER_CONTROL_URL: http://control:8000
      PRIMER_RETRIEVAL_URL: http://retrieval:8000
      # Encrypts the API keys of providers added through the settings page.
      # Optional here: without it, a provider that needs no key still works
      # and one that does is refused rather than stored in the clear.
      # Generate with: openssl rand -base64 32
      PRIMER_SETTINGS_ENCRYPTION_KEY: ${PRIMER_SETTINGS_ENCRYPTION_KEY:-}
      # Optional: without it, providers are added on the settings page.
      PRIMER_CHAT_BASE_URL: ${PRIMER_CHAT_BASE_URL:-}
      # Optional. Primer asks each provider what it serves, so this only
      # says which model to offer first; a name nothing serves is ignored.
      PRIMER_CHAT_MODEL: ${PRIMER_CHAT_MODEL:-}
      PRIMER_CHAT_API_KEY: ${PRIMER_CHAT_API_KEY:-}
      # Declared, never probed. See env.example.
      PRIMER_CHAT_SUPPORTS_LOGPROBS: ${PRIMER_CHAT_SUPPORTS_LOGPROBS:-false}
      PRIMER_CHAT_SUPPORTS_PROMPT_LOGPROBS: ${PRIMER_CHAT_SUPPORTS_PROMPT_LOGPROBS:-false}
    command:
      ["uvicorn", "primer_chat.app:create_app", "--factory",
       "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Two workers, as in the chart. Parsing holds the CPU and a whole document
  # in memory; embedding and indexing wait on a model endpoint. One process
  # for both made every document in flight wait behind the slowest parse,
  # and sized its pool for the parse when most of its work is a socket.
  worker-parse:
    <<: *worker
    environment:
      <<: *worker-env
      PRIMER_ENABLE_OCR: ${PRIMER_ENABLE_OCR:-true}
      # Docling's models run on torch, which otherwise starts a thread per
      # core on the host and contends with itself.
      PRIMER_PARSE_DEVICE: ${PRIMER_PARSE_DEVICE:-auto}
      PRIMER_PARSE_THREADS: ${PRIMER_PARSE_THREADS:-4}
      # Chunks are sized with this model's tokenizer, so they fit what
      # Retrieval embeds them with. PRIMER_CHUNK_TOKENIZER overrides it, for
      # a hosted model that publishes no tokenizer of its own.
      PRIMER_EMBEDDING_MODEL: *embedding-model
      PRIMER_CHUNK_TOKENIZER: ${PRIMER_CHUNK_TOKENIZER:-}
      PRIMER_MAX_CHUNK_TOKENS: ${PRIMER_MAX_CHUNK_TOKENS:-512}
    volumes:
      - source-objects:/var/lib/primer/sources
      # Docling downloads layout models on first use. A named volume keeps
      # them across restarts; without it every container start re-downloads
      # half a gigabyte.
      - model-cache:/var/cache/primer/huggingface
    # One document at a time, in a process: two parses in one container is
    # two copies of the document and of Docling's models.
    command:
      ["celery", "-A", "primer_ingestion.worker", "worker",
       "--loglevel", "info",
       "--concurrency", "1", "--pool", "prefork",
       "-Q", "ingestion.parse"]

  worker-index:
    <<: *worker
    environment:
      <<: *worker-env
      # Reads entities and relations out of each passage for the graph.
      # Empty leaves extraction off; it needs PRIMER_GRAPH_URL as well.
      PRIMER_GRAPH_EXTRACTION_BASE_URL: ${PRIMER_GRAPH_EXTRACTION_BASE_URL:-}
      PRIMER_GRAPH_EXTRACTION_MODEL: ${PRIMER_GRAPH_EXTRACTION_MODEL:-}
      PRIMER_GRAPH_EXTRACTION_API_KEY: ${PRIMER_GRAPH_EXTRACTION_API_KEY:-}
    volumes:
      - source-objects:/var/lib/primer/sources
    # Threads, because every task here waits on the network.
    command:
      ["celery", "-A", "primer_ingestion.worker", "worker",
       "--loglevel", "info",
       "--concurrency", "8", "--pool", "threads",
       "-Q", "ingestion.embed,ingestion.index,ingestion.delete"]

  web:
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.gui
    <<: *hardening
    depends_on:
      control:
        condition: service_healthy
    environment:
      PRIMER_CONTROL_URL: http://control:8000
      PRIMER_CHAT_URL: http://chat:8000
      PRIMER_LAB_URL: http://lab:8000
      PORT: ${PRIMER_WEB_PORT:-3000}
      ORIGIN: ${PRIMER_WEB_ORIGIN:-http://localhost:${PRIMER_WEB_PORT:-3000}}
      # adapter-node's own 512K default rejects uploads long before Control's
      # PRIMER_MAX_UPLOAD_BYTES gets a say, so this has to stay above it -
      # with headroom for multipart overhead, not equal to it.
      BODY_SIZE_LIMIT: ${PRIMER_WEB_BODY_SIZE_LIMIT:-115343360}
    ports:
      - "127.0.0.1:${PRIMER_WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
  rabbitmq-data:
  source-objects:
  model-cache:
  embedding-cache:
  rerank-cache:
  graph-data:
  lab-models:
