{{- if eq .Values.auth.mode "oidc" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "primer.fullname" . }}-auth
  labels:
    {{- include "primer.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  replicas: {{ .Values.auth.proxy.replicas }}
  selector:
    matchLabels:
      {{- include "primer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: auth
  template:
    metadata:
      labels:
        {{- include "primer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: auth
    spec:
      {{- include "primer.podIdentity" (dict "root" . "component" "auth") | nindent 6 }}
      {{- include "primer.topologySpread" (dict "root" . "component" "auth") | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: oauth2-proxy
          image: {{ .Values.auth.proxy.image }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - --provider=oidc
            - --oidc-issuer-url={{ required "auth.oidc.issuerUrl is required" .Values.auth.oidc.issuerUrl }}
            - --client-id={{ required "auth.oidc.clientId is required" .Values.auth.oidc.clientId }}
            - --redirect-url=https://{{ .Values.ingress.host }}/oauth2/callback
            - --http-address=0.0.0.0:4180
            - --upstream=http://{{ include "primer.fullname" . }}-web:3000
            - --reverse-proxy=true
            - --skip-provider-button=true
            # PKCE, because a public redirect and a leaked authorization code
            # are otherwise enough to complete someone else's sign-in.
            - --code-challenge-method=S256
            # Authentik's managed email scope mapping hardcodes
            # email_verified: false unconditionally - it doesn't track
            # per-user email verification at all, so this is true of every
            # account on every login, not a signal about this one. Without
            # this flag oauth2-proxy refuses the callback outright:
            # "email in id_token isn't verified", a 500 on every sign-in.
            - --insecure-oidc-allow-unverified-email=true
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --scope={{ .Values.auth.oidc.scopes }}
            {{- range .Values.auth.oidc.emailDomains }}
            - --email-domain={{ . }}
            {{- end }}
            # The headers Primer reads: X-Forwarded-User/-Email/-Groups, set
            # by the proxy from the verified session and overwritten rather
            # than appended - a request that arrived with its own must not
            # keep it. --set-xauthrequest is deliberately not here: that
            # flag sets X-Auth-Request-* on oauth2-proxy's own /oauth2/auth
            # *response*, for the separate nginx auth_request / Traefik
            # ForwardAuth pattern. In --upstream reverse-proxy mode, which
            # is what this is, nothing calls that endpoint and the flag
            # does nothing - Primer's services read the family this flag
            # actually forwards.
            - --pass-user-headers=true
          resources:
            {{- toYaml .Values.auth.proxy.resources | nindent 12 }}
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.oidc.existingSecret is required" .Values.auth.oidc.existingSecret }}
                  key: {{ .Values.auth.oidc.clientSecretKey }}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.existingSecret }}
                  key: {{ .Values.auth.oidc.cookieSecretKey }}
          ports:
            - name: http
              containerPort: 4180
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
          volumeMounts:
            {{- include "primer.scratchMounts" . | nindent 12 }}
      volumes:
        {{- include "primer.scratchVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "primer.fullname" . }}-auth
  labels:
    {{- include "primer.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 4180
      targetPort: http
      name: http
  selector:
    {{- include "primer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: auth
{{- end }}
