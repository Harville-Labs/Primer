apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "primer.fullname" . }}-chat
  labels:
    {{- include "primer.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat
spec:
  {{- if not (include "primer.autoscaled" (dict "root" . "component" "chat")) }}
  replicas: {{ .Values.chat.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "primer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: chat
  template:
    metadata:
      labels:
        {{- include "primer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: chat
    spec:
      {{- include "primer.podIdentity" (dict "root" . "component" "chat") | nindent 6 }}
      {{- include "primer.topologySpread" (dict "root" . "component" "chat") | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: chat
          image: {{ include "primer.image" (dict "root" . "component" "api") }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - uvicorn
            - primer_chat.app:create_app
            - --factory
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          env:
            {{- include "primer.commonEnv" . | nindent 12 }}
            {{- include "primer.databaseEnv" . | nindent 12 }}
            - name: PRIMER_CONTROL_URL
              value: http://{{ include "primer.fullname" . }}-control:8000
            - name: PRIMER_RETRIEVAL_URL
              value: http://{{ include "primer.fullname" . }}-retrieval:8000
            {{- /*
            Optional, like the model below and for the same reason. Primer
            reports having nowhere to send a question as itself - the picker
            says no model is available and the composer shuts - so an install
            without an endpoint yet is a deployment an operator can log into
            and finish configuring, rather than a chart that refuses to
            render. Providers can also be added from the settings page, which
            is a path that never touches this value at all.
            */}}
            {{- if .Values.inference.chat.baseUrl }}
            - name: PRIMER_CHAT_BASE_URL
              value: {{ .Values.inference.chat.baseUrl | quote }}
            {{- end }}
            {{- /*
            Optional. Primer asks each provider what it serves, so naming a
            model here only says which to offer first - and a name nothing
            serves is ignored rather than put in the picker as though it were
            available. Requiring it made a deployment fail over a value it
            did not need.
            */}}
            {{- if .Values.inference.chat.model }}
            - name: PRIMER_CHAT_MODEL
              value: {{ .Values.inference.chat.model | quote }}
            {{- end }}
            - name: PRIMER_CHAT_HISTORY_MESSAGES
              value: {{ .Values.inference.chat.historyMessages | quote }}
            - name: PRIMER_CHAT_CONTEXT_TOKENS
              value: {{ .Values.inference.chat.contextTokens | quote }}
            - name: PRIMER_CHAT_REPLY_TOKENS
              value: {{ .Values.inference.chat.replyTokens | quote }}
            - name: PRIMER_CHAT_CHARACTERS_PER_TOKEN
              value: {{ .Values.inference.chat.charactersPerToken | quote }}
            - name: PRIMER_CHAT_COMPACT_HISTORY
              value: {{ .Values.inference.chat.compactHistory | quote }}
            - name: PRIMER_CHAT_SUMMARY_TOKENS
              value: {{ .Values.inference.chat.summaryTokens | quote }}
            - name: PRIMER_CHAT_SUPPORTS_LOGPROBS
              value: {{ .Values.inference.chat.supportsLogprobs | quote }}
            - name: PRIMER_CHAT_SUPPORTS_PROMPT_LOGPROBS
              value: {{ .Values.inference.chat.supportsPromptLogprobs | quote }}
            {{- with .Values.inference.chat.modelContextTokens }}
            - name: PRIMER_CHAT_MODEL_CONTEXT_TOKENS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- if .Values.inference.chat.existingSecret }}
            - name: PRIMER_CHAT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.inference.chat.existingSecret }}
                  key: {{ .Values.inference.chat.apiKeyKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.chat.resources | nindent 12 }}
          volumeMounts:
            {{- include "primer.scratchMounts" . | nindent 12 }}
      volumes:
        {{- include "primer.scratchVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "primer.fullname" . }}-chat
  labels:
    {{- include "primer.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      name: http
  selector:
    {{- include "primer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: chat
