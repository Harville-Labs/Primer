{{- if .Values.migrations.enabled }}
{{/*
Migrations as a pre-upgrade hook, never an init container.

An init container runs once per pod, so a three-replica rollout would have
three processes racing to alter the same schema. A hook runs once per
release and everything else waits for it to succeed.
*/}}
{{/*
Keyed by the directory each service's alembic.ini lives in. Retrieval has
none: Qdrant creates its collection on first use.
*/}}
{{/*
A PostgreSQL this release runs does not exist before the release does, so on
install the SQL migrations run after it instead, behind an init container
that waits for the server to accept connections. On an upgrade it is already
there, so they stay pre-upgrade: new pods never start against the old schema.
*/}}
{{/*
Lab's runs in Lab's own image, the only one that has its migrations, and
the very tag its Deployment pulls: a GPU node then fetches one large image
rather than two.
*/}}
{{- $bundled := .Values.postgresql.bundled }}
{{- $sqlPhase := ternary "post-install,pre-upgrade" "pre-install,pre-upgrade" $bundled.enabled }}
{{- $api := include "primer.image" (dict "root" . "component" "api") }}
{{- $schemas := dict "control" (dict "directory" "control-api" "image" $api) "chat" (dict "directory" "chat" "image" $api) }}
{{- if .Values.lab.enabled }}
{{- $labImage := include "primer.labImage" . }}
{{- $_ := set $schemas "lab" (dict "directory" "lab" "image" $labImage) }}
{{- end }}
{{- range $service, $schema := $schemas }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "primer.fullname" $ }}-migrate-{{ $service }}
  labels:
    {{- include "primer.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $sqlPhase }}
    "helm.sh/hook-weight": "-5"
    # Kept after success so the logs of a failed migration survive long
    # enough to read. A deleted job takes its explanation with it.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ $.Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "primer.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: migrate-{{ $service }}
    spec:
      restartPolicy: Never
      {{- include "primer.podIdentity" (dict "root" $ "component" "migrate") | nindent 6 }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- if $bundled.enabled }}
      initContainers:
        # Bounded, so a server that never comes up fails the hook with a
        # reason instead of holding the release open.
        - name: wait-for-postgresql
          image: {{ printf "%s:%s" $bundled.image.repository $bundled.image.tag }}
          imagePullPolicy: {{ $bundled.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          command:
            - sh
            - -c
            - >-
              timeout 300 sh -c 'until pg_isready -h {{ include "primer.postgresqlHost" $ }} -U primer -d primer;
              do sleep 2; done' || { echo "the bundled PostgreSQL did not accept connections within five minutes; see kubectl logs {{ include "primer.postgresqlHost" $ }}-0" >&2; exit 1; }
          resources:
            {{- toYaml $.Values.migrations.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ $schema.image }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          workingDir: /app/services/{{ $schema.directory }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "primer.commonEnv" $ | nindent 12 }}
            {{- include "primer.databaseEnv" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.migrations.resources | nindent 12 }}
          volumeMounts:
            {{- include "primer.scratchMounts" $ | nindent 12 }}
      volumes:
        {{- include "primer.scratchVolumes" $ | nindent 8 }}
{{- end }}
{{- if include "primer.graphUrl" . }}
{{/*
The knowledge graph's constraints and indexes, beside the SQL migrations and
for the same reason: once per release, rather than raced by every Retrieval
replica. Not Alembic, because there is no history to record - every
statement is `IF NOT EXISTS`, so rerunning it on each upgrade is the whole
design.

A Neo4j this release runs moves it to after install and after upgrade. A
pre hook runs before the release's own resources are applied, so it would
wait for a Neo4j that does not exist yet and fail: on every install, and on
the upgrade that first turns the bundled Neo4j on - which, with the graph on
by default, is the upgrade every release from before it makes. Pre-upgrade
on later upgrades only would need the hook to know whether the StatefulSet
already exists, and a lookup cannot answer that under `helm template` or a
dry run.

The cost is that Retrieval may run new code for a moment against the
previous schema. That is harmless while the schema only grows by indexes. A
release that adds a uniqueness constraint must not rely on it being in
place before the hook has run, since MERGE racing without one can write the
duplicate that then stops the constraint being created.
*/}}
{{- $phase := ternary "post-install,post-upgrade" "pre-install,pre-upgrade" .Values.graph.neo4j.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "primer.fullname" . }}-migrate-graph
  labels:
    {{- include "primer.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $phase }}
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "primer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate-graph
    spec:
      restartPolicy: Never
      {{- include "primer.podIdentity" (dict "root" . "component" "migrate") | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "primer.image" (dict "root" . "component" "api") }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["python", "-m", "primer_retrieval.graph_schema"]
          env:
            {{- include "primer.graphEnv" . | trim | nindent 12 }}
            {{- with include "primer.extraEnv" . }}{{ . | trim | nindent 12 }}{{- end }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            {{- include "primer.scratchMounts" . | nindent 12 }}
      volumes:
        {{- include "primer.scratchVolumes" . | nindent 8 }}
{{- end }}
{{- end }}
