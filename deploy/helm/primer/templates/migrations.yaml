{{- if .Values.migrations.enabled }}
{{/*
Migrations as a pre-upgrade hook, never an init container.

An init container runs once per pod, so a three-replica rollout would have
three processes racing to alter the same schema. A hook runs once per
release and everything else waits for it to succeed.
*/}}
{{/*
Keyed by the directory each service's alembic.ini lives in. The vector
schema has no Primer-defined tables - the vector integration creates its
own - but nothing else creates the schema to put them in, or the extension
its embedding column needs.
*/}}
{{- range $service, $directory := dict "control" "control-api" "chat" "chat" "vectors" "retrieval" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "primer.fullname" $ }}-migrate-{{ $service }}
  labels:
    {{- include "primer.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # Kept after success so the logs of a failed migration survive long
    # enough to read. A deleted job takes its explanation with it.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ $.Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "primer.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: migrate-{{ $service }}
    spec:
      restartPolicy: Never
      {{- include "primer.podIdentity" (dict "root" $ "component" "migrate") | nindent 6 }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "primer.image" (dict "root" $ "component" "api") }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          workingDir: /app/services/{{ $directory }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "primer.commonEnv" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.migrations.resources | nindent 12 }}
          volumeMounts:
            {{- include "primer.scratchMounts" $ | nindent 12 }}
      volumes:
        {{- include "primer.scratchVolumes" $ | nindent 8 }}
{{- end }}
{{- if .Values.graph.url }}
{{/*
The knowledge graph's constraints and indexes, beside the SQL migrations and
for the same reason: once per release, before any Retrieval replica writes.
Not Alembic, because there is no history to record - every statement is
`IF NOT EXISTS`, so rerunning it on each upgrade is the whole design.
*/}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "primer.fullname" . }}-migrate-graph
  labels:
    {{- include "primer.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "primer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate-graph
    spec:
      restartPolicy: Never
      {{- include "primer.podIdentity" (dict "root" . "component" "migrate") | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "primer.image" (dict "root" . "component" "api") }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["python", "-m", "primer_retrieval.graph_schema"]
          env:
            {{- include "primer.graphEnv" . | trim | nindent 12 }}
            {{- with include "primer.extraEnv" . }}{{ . | trim | nindent 12 }}{{- end }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            {{- include "primer.scratchMounts" . | nindent 12 }}
      volumes:
        {{- include "primer.scratchVolumes" . | nindent 8 }}
{{- end }}
{{- end }}
