{{/*
The embedding and reranking servers this release runs, when it runs them.

llama.cpp's llama-server for both, one replica each. They are one template
because they are one kind of thing: the same image, the same hardening, the
same model cache, differing in the weights and a few flags. A second copy of
this would be the one whose securityContext nobody updated.

A StatefulSet rather than a Deployment for the cache's sake. The model is a
download onto a ReadWriteOnce volume, and a Deployment's rolling update
starts the new pod before stopping the old one - on another node that waits
forever for a volume the old pod still holds.

Run under the same hardening as every other pod here. llama-server writes
only the download cache, which LLAMA_CACHE puts on the volume at /data;
HOME points the Hugging Face client's other state at /tmp, since the
image's home is not writable.

The flags, and what each one prevents:

  --alias         the server answers to the name Primer knows the model
                  by, not the file it loaded, so /v1/models agrees with
                  Retrieval's configuration.
  --kv-unified-per-slot
                  each of the --parallel slots holds the declared input
                  limit, and the KV cache is sized to all of them. A longer
                  input is refused with a 400, not truncated; --ctx-size
                  alone would be divided between the slots, and refuse
                  chunks the worker was told were fine.
  --ubatch-size   an embedding is computed over its whole input in one
                  physical batch, so this has to hold the longest one.
  --pooling       stated, never left to the file. See values.yaml.
*/}}
{{- $full := include "primer.fullname" . }}
{{- $image := .Values.inference.modelServer.image }}
{{- $servers := list }}
{{- with .Values.inference.embeddings }}
{{- if .bundled.enabled }}
{{- $tokens := int .capabilities.maxInputTokens }}
{{- $args := list "--embedding" "--pooling" .bundled.pooling }}
{{- $servers = append $servers (dict "component" "embeddings" "model" .model "bundled" .bundled "tokens" $tokens "args" $args) }}
{{- end }}
{{- end }}
{{- with .Values.inference.rerank }}
{{- if .bundled.enabled }}
{{- $servers = append $servers (dict "component" "reranker" "model" .model "bundled" .bundled "tokens" (int .bundled.maxInputTokens) "args" (list "--reranking")) }}
{{- end }}
{{- end }}
{{- range $server := $servers }}
{{- $component := $server.component }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-{{ $component }}
  labels:
    {{- include "primer.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "primer.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-{{ $component }}
  labels:
    {{- include "primer.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: 1
  serviceName: {{ $full }}-{{ $component }}
  selector:
    matchLabels:
      {{- include "primer.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "primer.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      {{- include "primer.podIdentity" (dict "root" $ "component" $component) | nindent 6 }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: llama-server
          image: {{ printf "%s:%s" $image.repository $image.tag }}
          imagePullPolicy: {{ $image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - -hf
            - {{ required (printf "inference.*.bundled.gguf is required for the bundled %s server" $component) $server.bundled.gguf | quote }}
            - --alias
            - {{ required (printf "a model is required for the bundled %s server" $component) $server.model | quote }}
            - --kv-unified-per-slot
            - {{ $server.tokens | quote }}
            - --parallel
            - {{ $server.bundled.parallel | quote }}
            - --batch-size
            - {{ $server.tokens | quote }}
            - --ubatch-size
            - {{ $server.tokens | quote }}
            {{- range $server.args }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: LLAMA_CACHE
              value: /data
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
          # The first start downloads the model, which is minutes on a slow
          # link; a startup probe gives it that once without making a hung
          # server wait as long to be restarted later.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          resources:
            {{- toYaml $server.bundled.resources | nindent 12 }}
          volumeMounts:
            - name: model-cache
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: model-cache
        labels:
          {{- include "primer.selectorLabels" $ | nindent 10 }}
          app.kubernetes.io/component: {{ $component }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $server.bundled.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $server.bundled.persistence.size }}
{{- end }}
