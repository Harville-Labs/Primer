{{/*
The one secret this chart creates.

Everything else is referenced by name from a secret the operator already
manages, because a chart that generated database passwords would put them in
the release and in `helm get values`.

This one is different: it holds Primer's own cluster-internal credentials,
meaningful to nothing outside this release - the service tokens, the key for
stored provider keys, and the password of a Neo4j the release runs when the
operator names none. It is generated once and then
preserved across upgrades - regenerating it on every `helm upgrade` would
leave in-flight workers holding a credential the API had just stopped
accepting.
*/}}
{{/*
A hook, and not an ordinary resource, because the migration Jobs are
pre-install hooks that read this token. Helm applies ordinary manifests only
after every pre-install hook has succeeded, so on a fresh install those Jobs
would wait forever on a secret that cannot exist yet.

Weight -10 puts it ahead of the migrations at -5. The lookup above runs at
render time, before before-hook-creation deletes the previous copy, so the
token still survives an upgrade. The cost is that `helm uninstall` leaves
this secret behind - hooks are not part of the release manifest.
*/}}
{{- $name := printf "%s-internal" (include "primer.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "primer.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  internal-token: {{ if $existing }}{{ index $existing.data "internal-token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  # One credential per kind of caller, so that what each may do is decided
  # by which it holds. The `default` lets an upgrade from a release that had
  # only the internal token add them.
  worker-token: {{ if $existing }}{{ index $existing.data "worker-token" | default (randAlphaNum 48 | b64enc) }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  web-token: {{ if $existing }}{{ index $existing.data "web-token" | default (randAlphaNum 48 | b64enc) }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  # Encrypts the API keys of providers added through the settings page.
  # Generated once and then carried forward by the lookup above, like the
  # token: regenerating it would leave every stored key undecryptable, and
  # Primer would report exactly that rather than authenticate with nonsense.
  #
  # 32 bytes, which is what AES-256 takes. randAlphaNum gives 32 ASCII
  # characters, so the value is already the right length before encoding.
  settings-key: {{ if $existing }}{{ index $existing.data "settings-key" | default (randAlphaNum 32 | b64enc | b64enc) }}{{ else }}{{ randAlphaNum 32 | b64enc | b64enc }}{{ end }}
  {{- if and .Values.graph.neo4j.enabled (not .Values.graph.existingSecret) }}
  # The bundled Neo4j's password, when no Secret is named for it. Neo4j reads
  # it once, on first start, so it is carried forward like the token: a new
  # one on each upgrade would lock Retrieval out of a store that still has
  # the old one.
  graph-password: {{ if $existing }}{{ index $existing.data "graph-password" | default (randAlphaNum 32 | b64enc) }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
  {{- end }}
  {{- if .Values.tools.search.enabled }}
  # SearXNG's secret_key, which signs its own image proxy and preference
  # links. Carried forward like the rest so an upgrade does not change it.
  search-secret: {{ if $existing }}{{ index $existing.data "search-secret" | default (randAlphaNum 32 | b64enc) }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
  {{- end }}
