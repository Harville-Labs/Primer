{{- if .Values.serviceAccounts.create }}
{{/*
One account per component.

Every workload ran as the namespace's `default` account, which meant they
shared whatever that account could do and could not be told apart in an
audit log. None of them calls the Kubernetes API, so none of these accounts
is granted anything: they exist to be distinct, and the token is not
mounted.

Annotations are per component as well as shared, because the reason to
annotate one of these is usually cloud IAM - and only the workloads that
open a source object have any business assuming a role that can read the
bucket.
*/}}
{{/*
A hook, and for the same reason as primer-internal in secrets.yaml: the
migrate component's account has to exist before the migration Jobs, which
are pre-install hooks themselves and set serviceAccountName from it. Same
weight, since neither resource depends on the other.

hook-delete-policy is required here and isn't for the secret - a hook
resource with no delete policy is created fresh on every run, and a second
create of the same name fails. There is no value in this ServiceAccount that
an upgrade needs to preserve, so deleting the old one first is free.
*/}}
{{- $components := list "control" "chat" "retrieval" "web" }}
{{- if eq .Values.auth.mode "oidc" }}
{{- $components = append $components "auth" }}
{{- end }}
{{- if .Values.migrations.enabled }}
{{- $components = append $components "migrate" }}
{{- end }}
{{- range $name, $worker := .Values.workers }}
{{- $components = append $components (printf "worker-%s" $name) }}
{{- end }}
{{- if .Values.graph.neo4j.enabled }}
{{- $components = append $components "neo4j" }}
{{- end }}
{{- if .Values.vectorStore.qdrant.enabled }}
{{- $components = append $components "qdrant" }}
{{- end }}
{{- if .Values.postgresql.bundled.enabled }}
{{- $components = append $components "postgresql" }}
{{- end }}
{{- if .Values.inference.embeddings.bundled.enabled }}
{{- $components = append $components "embeddings" }}
{{- end }}
{{- if .Values.inference.rerank.bundled.enabled }}
{{- $components = append $components "reranker" }}
{{- end }}
{{- if .Values.lab.enabled }}
{{- $components = append $components "lab" }}
{{- end }}
{{- range $component := $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "primer.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "primer.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- $extra := merge (dict) (get $.Values.serviceAccounts.perComponent $component | default dict) $.Values.serviceAccounts.annotations }}
  {{- with $extra }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
