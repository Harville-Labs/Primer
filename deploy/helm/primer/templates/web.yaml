apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "primer.fullname" . }}-web
  labels:
    {{- include "primer.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not (include "primer.autoscaled" (dict "root" . "component" "web")) }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "primer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "primer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- include "primer.podIdentity" (dict "root" . "component" "web") | nindent 6 }}
      {{- include "primer.topologySpread" (dict "root" . "component" "web") | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        # The Node image's own user; overriding it to Primer's would leave
        # the process without a passwd entry.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "primer.image" (dict "root" . "component" "web") }}
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: PORT
              value: "3000"
            - name: ORIGIN
              value: {{ printf "https://%s" (required "ingress.host is required so the web app knows its own origin" .Values.ingress.host) | quote }}
            # The browser never reaches these directly; the web server calls
            # them and forwards the identity headers the proxy set.
            - name: PRIMER_CONTROL_URL
              value: http://{{ include "primer.fullname" . }}-control:8000
            - name: PRIMER_CHAT_URL
              value: http://{{ include "primer.fullname" . }}-chat:8000
            {{- if .Values.lab.enabled }}
            - name: PRIMER_LAB_URL
              value: http://{{ include "primer.fullname" . }}-lab:8000
            {{- end }}
            # adapter-node rejects anything over this before a request ever
            # reaches upload validation, so it has to be at least as large as
            # Control's own max_upload_bytes (100MB by default) plus room for
            # multipart overhead - otherwise every upload near that size fails
            # with a body-size-limit error the UI cannot distinguish from a
            # real one.
            - name: BODY_SIZE_LIMIT
              value: {{ .Values.web.bodySizeLimit | quote }}
          ports:
            - name: http
              containerPort: 3000
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "primer.fullname" . }}-web
  labels:
    {{- include "primer.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      name: http
  selector:
    {{- include "primer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
