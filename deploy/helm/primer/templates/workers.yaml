{{- $cache := .Values.workers.parse.modelCache -}}
{{- if and $cache.enabled (eq $cache.accessMode "ReadWriteOnce") (gt (int .Values.workers.parse.replicas) 1) -}}
{{- /*
Only reachable by asking for the contradiction outright, since an unset
accessMode derives ReadWriteMany at this replica count. Refused rather
than rendered, because the alternative is a deployment that installs
cleanly and then does not run: every replica mounts the one cache claim, a
ReadWriteOnce volume can be attached by one node, and the second replica is
scheduled, fails to attach, and sits Pending indefinitely - which tells
whoever finds it nothing about access modes.
*/ -}}
{{- fail (printf "workers.parse.replicas is %v, but workers.parse.modelCache.accessMode is set to ReadWriteOnce, which only one node can attach. Leave accessMode unset to get ReadWriteMany at this replica count, or set modelCache.enabled to false (every pod then re-downloads Docling's models on start), or keep replicas at 1." .Values.workers.parse.replicas) -}}
{{- end -}}
{{/*
Two worker deployments, not one.

Parsing is CPU-heavy and holds whole documents in memory; embedding and
indexing mostly wait on a network call. Splitting them by queue lets each
scale on what actually constrains it, and stops a burst of uploads from
starving the stage that finishes them.
*/}}
{{- range $name, $worker := .Values.workers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "primer.fullname" $ }}-worker-{{ $name }}
  labels:
    {{- include "primer.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker-{{ $name }}
spec:
  replicas: {{ $worker.replicas }}
  {{- if and (eq $name "parse") $worker.modelCache.enabled (eq (include "primer.modelCacheAccessMode" $) "ReadWriteOnce") }}
  # A ReadWriteOnce model cache cannot be attached twice, so a RollingUpdate
  # surge pod cannot mount it while the pod it is replacing still holds it -
  # the storage provisioner refuses the second attachment and the rollout
  # hangs until the old pod is gone, which a RollingUpdate will not do
  # first. Recreate accepts the gap in availability that a cache which can
  # only be held by one pod already implies.
  #
  # ReadWriteMany does not have the problem and is not given this: a shared
  # cache is what makes a rolling update, and more than one replica, work
  # at all.
  #
  # rollingUpdate explicitly nulled, not omitted: the API server had already
  # defaulted it onto the live object from every prior release's implicit
  # RollingUpdate, and helm-controller applies through server-side apply -
  # a manifest that is merely silent about the field leaves that stale value
  # in place, and Recreate with a non-empty rollingUpdate is rejected
  # outright ("may not be specified when strategy type is 'Recreate'"). Null
  # is what tells SSA to clear a field an earlier apply owned.
  strategy:
    type: Recreate
    rollingUpdate: null
  {{- end }}
  selector:
    matchLabels:
      {{- include "primer.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: worker-{{ $name }}
  template:
    metadata:
      labels:
        {{- include "primer.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: worker-{{ $name }}
    spec:
      {{- include "primer.podIdentity" (dict "root" $ "component" (printf "worker-%s" $name)) | nindent 6 }}
      {{- include "primer.topologySpread" (dict "root" $ "component" (printf "worker-%s" $name)) | nindent 6 }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "primer.image" (dict "root" $ "component" "worker") }}
          imagePullPolicy: {{ $.Values.image.worker.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          command:
            - celery
            - -A
            - primer_ingestion.worker
            - worker
            - --loglevel
            - info
            # Stated, never inferred. Celery sizes its prefork pool from the
            # node's CPU count when this is absent, so a worker landing on a
            # large node forks a dozen children against a limit set for a
            # couple - and is killed on startup, before doing any work, for
            # a reason that has nothing to do with the work.
            - --concurrency
            - {{ required (printf "workers.%s.concurrency is required" $name) $worker.concurrency | quote }}
            - -Q
            {{- if eq $name "parse" }}
            - ingestion.parse
            {{- else }}
            - ingestion.embed,ingestion.index,ingestion.delete
            {{- end }}
          {{- include "primer.sourceStoreEnvFrom" $ | nindent 10 }}
          env:
            {{- include "primer.commonEnv" $ | nindent 12 }}
            {{- include "primer.databaseEnv" $ | nindent 12 }}
            {{- include "primer.brokerEnv" $ | nindent 12 }}
            - name: PRIMER_CONTROL_URL
              value: http://{{ include "primer.fullname" $ }}-control:8000
            - name: PRIMER_RETRIEVAL_URL
              value: http://{{ include "primer.fullname" $ }}-retrieval:8000
            {{- if eq $name "parse" }}
            {{- with include "primer.chunkingEnv" $ }}{{ . | trim | nindent 12 }}{{- end }}
            {{- with include "primer.pictureEnv" $ }}{{ . | trim | nindent 12 }}{{- end }}
            {{- else }}
            {{- with include "primer.graphExtractionEnv" $ }}{{ . | trim | nindent 12 }}{{- end }}
            {{- end }}
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
          volumeMounts:
            {{- include "primer.scratchMounts" $ | nindent 12 }}
            {{- if and (eq $name "parse") $worker.modelCache.enabled }}
            - name: model-cache
              mountPath: /var/cache/primer/huggingface
            {{- end }}
      volumes:
        {{- include "primer.scratchVolumes" $ | nindent 8 }}
        {{- if and (eq $name "parse") $worker.modelCache.enabled }}
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ include "primer.fullname" $ }}-model-cache
        {{- end }}
{{- end }}
{{- if .Values.workers.parse.modelCache.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "primer.fullname" . }}-model-cache
  labels:
    {{- include "primer.labels" . | nindent 4 }}
spec:
  # Docling downloads its layout models on first use. Without this, every
  # pod restart re-downloads half a gigabyte from a third-party host.
  #
  # Every parse replica mounts this one claim, so the access mode is what
  # decides whether the component can be scaled at all: ReadWriteOnce binds
  # the volume to a single node, and a second replica scheduled anywhere
  # else stays Pending with no attachment it is allowed to make.
  accessModes: [{{ include "primer.modelCacheAccessMode" . | quote }}]
  resources:
    requests:
      storage: {{ .Values.workers.parse.modelCache.size }}
  {{- with .Values.workers.parse.modelCache.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
