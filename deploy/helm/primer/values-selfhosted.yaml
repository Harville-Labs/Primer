# A working configuration for a self-hosted, CPU-only inference stack.
#
# Copy this, then set the eight values that name things outside the chart -
# your hostname, your identity provider, your secrets. Everything here is
# the part that is usually guesswork, and every number in it was measured
# rather than chosen. See docs/operations/models.md for why.
#
#   helm install primer oci://ghcr.io/harville-labs/charts/primer \
#     -f values-selfhosted.yaml \
#     --set ingress.host=primer.example.com \
#     --set auth.oidc.issuerUrl=https://auth.example.com/application/o/primer/ \
#     --set auth.oidc.clientId=primer \
#     --set auth.oidc.existingSecret=primer-oidc \
#     --set auth.adminGroup='Primer Admins' \
#     --set postgresql.existingSecret=primer-postgres \
#     --set rabbitmq.existingSecret=primer-rabbitmq \
#     --set sourceStore.existingSecret=primer-s3
#
# The embedding and reranking servers are the ones the chart runs by
# default (`inference.*.bundled`). To point at a vLLM or another server
# you already run, see docs/operations/providers.md.

inference:
  embeddings:
    # Served by the bundled llama-server from Qwen's own Q8_0 GGUF, pooled
    # by the last token. Primer knows this model, so its 1024 dimensions,
    # its query instruction and its tokenizer follow from the name with
    # nothing else to set.
    model: Qwen/Qwen3-Embedding-0.6B

  # A cross-encoder reads the question and a passage together, which a
  # vector search cannot: its two embeddings were made without knowing
  # about each other.
  #
  # The partner to the embedding model above. On CPU it is the slowest part
  # of a search - about five seconds for twenty passages on fifteen cores -
  # which is the price of a reranker that separates answers from passages
  # that merely share their topic. Lower `candidates`, or turn
  # `rerank.bundled` off, on a node that cannot spare the time.
  rerank:
    model: Qwen/Qwen3-Reranker-0.6B
    # Fetched by the vector search, read by the reranker, narrowed to the
    # answer. Wider than the answer needs on purpose - the passage that
    # answers a question is often inside the first twenty and outside the
    # first six, which is the entire reason to rerank.
    candidates: 20

  # Passages scoring below this are dropped, even when that leaves nothing.
  # Returning nothing is the point: without a floor, a question your library
  # cannot answer still arrives with a full set of passages attached, and
  # the model is handed them as evidence.
  #
  # Checked against the reranker above, whose scores this reads: it is
  # close to binary, scoring an answering passage near 1 and an
  # unanswerable question's best passage under 0.005. That was a small
  # check, not a benchmark. Re-measure on your own corpus before trusting
  # it, and err low: a floor that is too high discards correct answers.
  #
  # Remove the reranker and this number becomes meaningless - it would then
  # be compared against cosine similarity, which runs on a different scale
  # entirely. The two move together.
  minScore: "0.02"

  chat:
    # Left for you. Primer reports having nowhere to send a question as
    # itself, so a deployment with no chat endpoint is one you can log into
    # and finish setting up - and providers can be added from the settings
    # page instead of here.
    #
    # A model that shows its reasoning needs its server configured to
    # separate it: llama.cpp wants `--reasoning-format deepseek --jinja`,
    # vLLM wants `--reasoning-parser`. Without that the thinking arrives
    # inside the answer.
    baseUrl: ""
    model: ""

ingestion:
  # Empty on purpose. The parse worker derives the tokenizer from
  # `inference.embeddings.model` above, and a value here would be a second
  # thing to keep in step with it.
  chunkTokenizer: ""
  # A paragraph-sized passage: long enough that a citation reads as prose,
  # short enough that one embedding is about one thing.
  maxChunkTokens: 512
  # Chunking splits on structure first, and a document whose labels are
  # recognised as headings - a form, a W2, a statement - ends up one value
  # per chunk: passages of "52,000.00" that answer nothing and score
  # against questions they cannot answer. Passages shorter than this are
  # joined to the ones beside them, never across a page.
  #
  # Far below ordinary prose on purpose. The fragments this exists for
  # measure 8 to 15 characters; a real sentence is 60 or more. Raised
  # towards sentence length it starts merging passages that were fine and
  # taking their section citations with them. 0 switches it off.
  minChunkChars: 40

workers:
  parse:
    # Parsing is CPU-bound and holds Docling's layout models in memory - one
    # process measured 5.4GiB against a 6GiB limit, so a second in the same
    # container is an OOM. Scale with replicas instead, which the chart
    # supports: the model cache access mode follows this number.
    replicas: 1
    concurrency: 1
  index:
    # This one mostly waits on the embedding endpoint, so it is bounded by
    # that server rather than by anything here. Raising it will not make a
    # CPU-only embedder faster - measured, it does not batch or parallelise.
    replicas: 1
    concurrency: 4
