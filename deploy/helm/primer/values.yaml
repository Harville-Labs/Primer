# Primer, for a deployment other people use.
#
# This is the multi-user story. Compose is deliberately single-user; here is
# where the ingress, the identity provider, and the trusted-header boundary
# live.
#
# --- The short version --------------------------------------------------
#
# Nine values have no default and cannot have one: they name things that
# exist outside this chart, and a chart that guessed at them would deploy
# something that looks installed and answers nothing. Everything else below
# has a working default.
#
#   ingress.host                     what the deployment is called
#   auth.oidc.issuerUrl              your identity provider
#   auth.oidc.clientId
#   auth.oidc.existingSecret         holding client-secret and cookie-secret
#   auth.adminGroup                  who may open the settings page
#   postgresql.existingSecret        holding a connection URI, or the
#                                    password for a bundled PostgreSQL
#   rabbitmq.existingSecret          holding a broker URL
#   sourceStore.existingSecret       credentials for the document bucket
#   inference.embeddings.baseUrl     an OpenAI-compatible /v1/embeddings
#   inference.embeddings.model       the name that endpoint serves
#
# Two of those are worth saying twice, because both deploy cleanly and fail
# later as something else:
#
#   `inference.embeddings.model` cannot be changed later by editing it: the
#   vector store keeps the width it was created with, so a change means
#   reindexing every library.
#
#   `auth.adminGroup` gates the settings page, and the settings page is the
#   only way to add an inference provider through the UI. Unset means nobody,
#   which is the safe default and also a deployment where that page 403s for
#   its own administrator.
#
# Notably NOT required: a chat endpoint. Primer reports having nowhere to
# send a question as itself, so a deployment with no model configured is one
# you can log into and finish setting up.
#
# `helm install` prints what it read and what it thinks is missing.

image:
  # One image for the three API services, another for the worker: Docling
  # needs torch and torch has no musl wheels, so sharing would put a machine
  # learning stack in services that never import it.
  api:
    repository: ghcr.io/isaiah-harville/primer-api
    tag: ""          # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  worker:
    repository: ghcr.io/isaiah-harville/primer-worker
    tag: ""
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/isaiah-harville/primer-web
    tag: ""
    pullPolicy: IfNotPresent
  pullSecrets: []

# --- Identity -----------------------------------------------------------
#
# Primer never validates a token. An authenticating proxy verifies the user
# against your provider and injects headers Primer trusts, which is why the
# ingress below strips those headers from inbound requests: without that,
# anyone could set them and be anyone.
auth:
  # The group whose members may open the settings page and change which
  # inference providers this deployment answers from. Asserted by the proxy
  # from the identity provider; Primer only reads it.
  #
  # Unset means nobody, deliberately. With authentication on, the alternative
  # to naming no one is naming everyone, and on a shared deployment that lets
  # any user repoint every question at an endpoint of their own.
  adminGroup: ""
  # Required. There is no default, because a chart that silently deployed a
  # shared, unauthenticated Primer into a cluster would be a trap.
  mode: oidc

  oidc:
    issuerUrl: ""
    clientId: ""
    # Referenced, never inlined. A secret in values.yaml ends up in
    # `helm get values`, in CI logs, and in whatever stores the release.
    existingSecret: ""
    clientSecretKey: client-secret
    cookieSecretKey: cookie-secret
    emailDomains:
      - "*"
    scopes: openid profile email groups

  proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    replicas: 2
    # The workload in front of every request, so the scheduler should know
    # its size. It holds a session cookie and forwards; it is not where the
    # work happens.
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }

# --- Ingress ------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: primer.example.com
  tlsSecret: primer-tls
  annotations: {}

# --- Data ---------------------------------------------------------------
#
# No broker is bundled. PostgreSQL can be, for a deployment with nowhere
# else to put one, but a database you already run and back up is the better
# home for a library: see docs/adr/0003-bundle-postgresql.md.
postgresql:
  # Required. For a PostgreSQL you run, a Secret holding its connection URI
  # under `urlKey`. With `bundled` on, a Secret holding the password under
  # `passwordKey` instead; the bundled server takes its password from the
  # same Secret, so the two cannot disagree.
  existingSecret: ""
  urlKey: database-url
  passwordKey: postgres-password
  # A PostgreSQL run by this release, as one replica with a
  # persistent volume. It is reachable only from the pods that use the
  # database. Its user and database are both `primer`.
  #
  # Unlike the bundled Neo4j, this holds the library itself: every document,
  # conversation and setting. Back up its volume, or use a PostgreSQL you
  # already back up.
  bundled:
    enabled: false
    image:
      repository: postgres
      tag: "17"
      pullPolicy: IfNotPresent
    persistence:
      size: 20Gi
      storageClass: ""   # the cluster default
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi

rabbitmq:
  existingSecret: ""
  urlKey: broker-url

sourceStore:
  # An fsspec URL. Object storage for more than one replica: a
  # ReadWriteOnce volume cannot be shared between nodes.
  url: s3://primer-sources
  # A Secret holding the backend's own environment - AWS_ACCESS_KEY_ID,
  # AWS_SECRET_ACCESS_KEY, FSSPEC_S3_ENDPOINT_URL for a non-AWS endpoint, and
  # anything else it wants. Every key is passed through, because those names
  # belong to the storage backend rather than to Primer.
  #
  # Mounted only into Control and the ingestion workers: nothing else opens a
  # source object.
  existingSecret: ""

# Settings this chart does not model, added to every Primer workload. An
# escape hatch, so a deployment that needs one variable does not need a fork
# or a post-renderer.
extraEnv: []
#  - name: HTTPS_PROXY
#    value: http://proxy.internal:3128

# --- Inference ----------------------------------------------------------
#
# Primer ships no model. These point at whatever you already run.
inference:
  # Passages scoring below this are dropped, even when that means a search
  # returns nothing - which is the point. A vector search always returns
  # its top k, so a question your library cannot answer comes back with a
  # full set of passages that are only the closest of a bad lot, and the
  # model is handed them as evidence. Measured on one library before this
  # existed, "describe the plot of the film Casablanca" scored higher
  # against a corpus of mortgage paperwork than a question the corpus
  # actually answered.
  #
  # Empty means no floor, which is the default: the right number is a
  # property of whatever produced the score, and this chart cannot know it.
  # Measure before setting one - embed a question alongside a passage that
  # answers it and one that does not, and put the floor between them. For
  # Qwen3-Embedding-0.6B that gap runs from about 0.19 for unrelated text
  # to about 0.65 for a passage that answers the question. With a reranker
  # configured this applies to the reranker's score instead, which is a
  # different scale again.
  minScore: ""
  chat:
    # Both optional. An endpoint is not required because Primer reports
    # having nowhere to send a question as itself, and providers can be added
    # from the settings page instead.
    baseUrl: ""
    # Not how a deployment is made to work: this only says which of the
    # models the endpoint serves a new conversation starts on. Left unset,
    # Primer asks what is served and starts on the first. Naming one the
    # endpoint does not serve is worse than naming none - it is offered as
    # though it were available, and every question on it is refused.
    model: ""
    existingSecret: ""
    apiKeyKey: chat-api-key
    # How much of a conversation a follow-up question may recall.
    historyMessages: 20
    # The context window assumed for any model not named in
    # modelContextTokens, and how much of it is held back for the answer.
    contextTokens: 8192
    replyTokens: 1024
    # modelContextTokens:
    #   llama3.1:70b: 131072
    modelContextTokens: {}
    # Prompt size is estimated, not measured: no tokenizer is right for
    # every OpenAI-compatible endpoint. Lower this if it under-counts.
    charactersPerToken: 4.0
    # Summarize the turns that no longer fit instead of dropping them, and
    # the room reserved for that summary. Costs a model call whenever
    # something is actually dropped, which is the reason to turn it off.
    compactHistory: true
    summaryTokens: 512
  embeddings:
    baseUrl: ""
    # The name your server answers to: a Hugging Face id for Text Embeddings
    # Inference or vLLM, Ollama's own name (`qwen3-embedding:0.6b`), or a
    # hosted model. Primer knows the width and the query and passage prompts
    # of the models people commonly run, and applies them itself - see
    # docs/operations/models.md for the list. Do not also configure the
    # server to add prompts, or they are applied twice.
    model: ""
    # Empty takes each of these from Primer's table. Set them only for a
    # model the table does not know - Retrieval refuses to start on one with
    # no width - or to override it, such as serving a truncated Matryoshka
    # width. Changing the width invalidates every stored vector.
    dimensions: ""
    queryPrefix: ""
    documentPrefix: ""
    existingSecret: ""
    apiKeyKey: embedding-api-key

  # Optional. A reranker reads a question and a passage together and scores
  # the pair, which a vector search cannot do - its two embeddings were made
  # without knowing about each other, so the passage that answers a question
  # is often inside the first twenty results and outside the first six.
  #
  # Leave baseUrl empty and nothing changes: retrieval returns the vector
  # ordering exactly as before. A reranker that is configured and then goes
  # down also falls back to that ordering rather than failing the search.
  rerank:
    baseUrl: ""
    model: ""
    existingSecret: ""
    apiKeyKey: rerank-api-key
    # How many the vector search fetches before reranking. Wider than the
    # answer needs on purpose; the shortlist is what the reranker reads.
    candidates: 20

# --- Vector store -------------------------------------------------------
#
# Qdrant, and only Qdrant: docs/adr/0004-qdrant-only.md says why. This
# release runs one by default, so an install needs nothing here.
vectorStore:
  # http:// or https:// for a Qdrant you run yourself. Set this or turn
  # `qdrant.enabled` off - not both, and not neither.
  url: ""
  # Optional. A Secret holding a Qdrant API key under `apiKeyKey`. Retrieval
  # sends it, and a bundled Qdrant requires it, from the same Secret.
  existingSecret: ""
  apiKeyKey: qdrant-api-key
  # A Qdrant run by this release, as one replica with a persistent volume.
  # It is reachable only from Retrieval, and reports nothing upstream.
  #
  # It holds embeddings, not documents: losing it costs a reindex, not a
  # library. Size the volume for roughly 4 KiB per passage at 1024
  # dimensions, plus the passage text.
  qdrant:
    enabled: true
    image:
      repository: qdrant/qdrant
      tag: "v1.19.0"
      pullPolicy: IfNotPresent
    persistence:
      size: 20Gi
      storageClass: ""   # the cluster default
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi

# --- Knowledge graph ----------------------------------------------------
#
# Optional, and off unless `url` is set. With it, the index worker asks a
# model for the entities and relations each passage names, and search
# follows them to passages that share no words with the question. See
# docs/architecture/retrieval.md for what it finds and what it costs.
#
# Neo4j Community is enough: the schema uses only uniqueness constraints and
# range indexes.
graph:
  # bolt:// or neo4j:// for a Neo4j you run yourself. Empty, with `neo4j`
  # below off, turns the graph off: nothing below is rendered and no pod
  # opens a connection to it.
  url: ""
  # A Neo4j run by this release instead, for a deployment with nowhere else
  # to put one. Set this or `url`, not both. It is reachable only from
  # Retrieval and the step that prepares its schema, on the Bolt port, and
  # its HTTP interface and browser are switched off.
  neo4j:
    enabled: false
    image:
      repository: neo4j
      tag: "5.26-community"
      pullPolicy: IfNotPresent
    # Neo4j sizes its heap and page cache from the machine, not the pod's
    # limit, and is killed for it. Keep the two together under the limit.
    heapSize: 512m
    pageCacheSize: 256m
    persistence:
      size: 10Gi
      storageClass: ""   # the cluster default
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 1Gi
  username: neo4j
  database: neo4j
  # Required once the graph is on. A Secret holding the Neo4j password under
  # `passwordKey`. A bundled Neo4j takes its initial password from the same
  # Secret, so it needs at least eight characters.
  existingSecret: ""
  passwordKey: graph-password
  # How far search follows relations from the entities a question names,
  # 0 to 2. Two reaches what is related to what is related to the question,
  # which is where a vector search has the least chance on its own.
  hops: 2
  # Passages the graph adds to a search before the two rankings are fused.
  # About as wide as the reranker's candidates, so neither drowns the other.
  candidates: 20
  # The model that reads entities out of passages: one call per passage,
  # which on a large library is the most expensive thing ingestion does. Any
  # OpenAI-compatible endpoint whose model supports structured output.
  #
  # Leaving it empty with the graph on is allowed and almost never wanted:
  # nothing writes to the graph, so search consults an empty one.
  extraction:
    baseUrl: ""
    model: ""
    existingSecret: ""
    apiKeyKey: graph-extraction-api-key
    # Passages sent to the model at once, per document being indexed. The
    # index worker's own concurrency multiplies it.
    concurrency: 4
    timeoutSeconds: 120

# --- Tools --------------------------------------------------------------
tools:
  # Off by default, deployment-wide. Turning this on without a sandbox
  # declaration on each execution server is refused at startup.
  enabled: false
  servers: []

# --- Scale --------------------------------------------------------------
#
# Parsing is CPU-heavy and holds whole documents in memory; embedding mostly
# waits on a network call. They are separate deployments so each scales on
# what actually constrains it.
control:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

retrieval:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }

chat:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

web:
  replicas: 2
  # Above Control's max_upload_bytes (100MB default), so a legitimate upload
  # never gets rejected by the web server before Control gets to validate it.
  bodySizeLimit: 110M
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# --- Ingestion ----------------------------------------------------------
#
# How an uploaded document is turned into the passages that get retrieved
# and quoted back. These decide what a citation looks like: chunks that are
# too small quote a word, chunks that are too large quote a page.
ingestion:
  # The tokenizer chunks are sized against. Left empty, the parse worker
  # takes it from `inference.embeddings.model`, which is right for every
  # self-hosted model.
  #
  # Set it only for a hosted model like `text-embedding-3-small`, which
  # publishes no tokenizer: name the nearest open model instead. Without
  # one, chunks are split on document structure alone, which stores a form
  # or a statement one line at a time, and the worker warns on startup.
  chunkTokenizer: ""
  # Ceiling per chunk, in that tokenizer's tokens. 512 is a passage: long
  # enough that a quoted citation reads as a paragraph, short enough that
  # the embedding is about one thing. Raise it towards 1024 for prose you
  # ask broad questions of; lower it for dense reference material where a
  # long chunk buries the sentence that actually answers.
  #
  # It must stay under the embedding model's own input limit. Anything
  # served by Text Embeddings Inference should also be started with
  # --auto-truncate, so a single over-long chunk is trimmed rather than
  # failing the whole batch it arrived in.
  maxChunkTokens: 512
  # Chunking splits on structure first, and a document whose labels are
  # recognised as headings - a form, a W2, a statement - ends up one value
  # per chunk: passages of "52,000.00" that answer nothing and score
  # against questions they cannot answer. Passages shorter than this are
  # joined to the ones beside them, never across a page.
  #
  # Far below ordinary prose on purpose. The fragments this exists for
  # measure 8 to 15 characters; a real sentence is 60 or more. Raised
  # towards sentence length it starts merging passages that were fine and
  # taking their section citations with them. 0 switches it off.
  minChunkChars: 40
  # Docling runs OCR only in its PDF pipeline. A slide deck or a report is
  # converted by one that has none, so text living inside a pasted chart or
  # a screenshot is read by this or not at all - and that is most of what a
  # deck is.
  #
  # Each picture costs a full OCR pass, so this is a bound on the slowest
  # thing the parse worker does rather than a view on how many images a
  # document should have. Past it the remaining pictures go unread instead
  # of the document going unfinished. 0 turns picture reading off while
  # leaving OCR on for PDFs.
  maxPicturesPerDocument: 100

workers:
  parse:
    replicas: 1
    # Processes per pod, and the number `resources` below has to be sized
    # for. One, because a parse holds a whole document in memory and loads
    # Docling's layout models: two of those in one container is two copies
    # of both. Scale this component with replicas rather than here.
    concurrency: 1
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits: { memory: 6Gi }
    # Docling downloads layout models on first use; without a persistent
    # cache every pod restart re-downloads half a gigabyte.
    modelCache:
      enabled: true
      size: 4Gi
      storageClass: ""
      # Left empty this follows `replicas` above, which is the only thing
      # that decides it: every parse replica mounts this one claim, so one
      # replica gets ReadWriteOnce and more than one gets ReadWriteMany.
      # Naming a default here instead would be a second thing to keep in
      # step with the replica count, and the two disagreeing is exactly the
      # failure deriving it removes - extra pods that can never attach
      # anything and sit Pending with no explanation.
      #
      # Scaling past one therefore needs a storage class that provides RWX
      # (Longhorn, CephFS, NFS, EFS and Azure Files do; the block volumes
      # behind EBS, GCE PD, Azure Disk and local-path do not). A cluster
      # without one sees the claim stay Pending - a plain answer to having
      # asked for a topology its storage cannot serve, and one that arrives
      # on the scaling path rather than the install path.
      #
      # Set it only to overrule that: a single replica on RWX (a share
      # manager and a network hop for a volume one pod opens), or several
      # on RWO, which the chart refuses outright.
      accessMode: ""
  index:
    replicas: 1
    # Higher, because this one mostly waits: embedding is a network call to
    # a model endpoint, and a process blocked on a socket is not using the
    # memory the limit is protecting.
    concurrency: 4
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 2Gi }

# --- Availability -------------------------------------------------------
#
# What keeps the replicas above, rather than what sets them.
podDisruptionBudgets:
  # A budget is written only for a component that runs more than one
  # replica. On a single-replica component a budget of any kind makes the
  # pod unevictable, and a node drain that never finishes is a worse
  # failure than the restart it was avoiding.
  enabled: true
  # One at a time. With two replicas that is the strongest budget that
  # still lets a node be drained at all.
  maxUnavailable: 1

# Off unless asked for, and only for the services whose load is requests.
#
# The workers are deliberately not here. Their work arrives on a queue, and
# queue depth is the only signal that describes it: an embedding worker
# spends its time waiting on a network call, so its CPU is near zero
# precisely when the backlog is longest. Scaling those on CPU would add
# pods when they are busy computing and none when they are behind. Wire
# KEDA to the broker if you want them autoscaled, and set `workers.*.
# replicas` until then.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  # 0 leaves the metric off. Memory is a poor scaling signal for a Python
  # service - an interpreter that has grown does not give the memory back -
  # so this is here for deployments that have measured it, not as a default.
  targetMemoryUtilizationPercentage: 0
  # Per component, merged over the settings above. `enabled: true` here
  # turns one service on without turning on the rest.
  control: {}
  chat: {}
  retrieval: {}
  web: {}

# --- Migrations ---------------------------------------------------------
#
# A pre-upgrade hook, never an init container on each pod: several replicas
# racing to alter one schema is what this avoids.
migrations:
  enabled: true
  backoffLimit: 1
  # Alembic on one connection. It is short-lived and single-threaded, and
  # the limit is here so that every container in this chart has one.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# --- Identity and isolation ---------------------------------------------
serviceAccounts:
  # One account per component instead of the namespace default, so what a
  # workload may do is stated per workload and an audit log can tell them
  # apart. None of them is granted anything: nothing here calls the
  # Kubernetes API, and no token is mounted.
  create: true
  annotations: {}
  # Merged over the above, keyed by component: control, chat, retrieval,
  # web, auth, migrate, worker-parse, worker-index. The usual reason is
  # cloud IAM, and only the workloads that open a source object have any
  # business assuming a role that can read the bucket.
  perComponent: {}
    # worker-parse:
    #   eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/primer-sources

networkPolicies:
  # Ingress-only, and worth reading docs/operations/kubernetes.md before
  # turning this off. A policy does nothing at all on a cluster whose CNI
  # does not enforce NetworkPolicy - the objects are accepted and ignored -
  # which is a bad way to believe you are isolated.
  enabled: true
  # Who may reach the public entry point. Empty means any namespace, because
  # an ingress controller lives in a namespace this chart cannot know the
  # name of. Naming it narrows the only rule here that is wider than it
  # could be.
  ingress: []
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: ingress-nginx
  # Whole NetworkPolicy objects, for a path this chart does not model - a
  # scraper reaching /metrics, say.
  extra: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Optional placement rule applied independently to each component's pods.
# ScheduleAnyway keeps single-node clusters installable; clusters with enough
# nodes can require separation and provide matchLabelKeys to avoid counting
# old ReplicaSet pods during a rollout.
podTopologySpread:
  enabled: false
  topologyKey: kubernetes.io/hostname
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway
  matchLabelKeys: []
