---
# The embedding server the chart runs as `inference.embeddings.bundled`,
# standing alone: llama.cpp's llama-server with the official GGUF of
# Qwen3-Embedding-0.6B. The image is published for amd64 and arm64.
#
# The flags mirror deploy/helm/primer/templates/models.yaml, whose comment
# says what each one prevents. Keep the two together: a server that pools
# or tokenizes differently from the one a library was indexed with returns
# vectors that fail nothing and retrieve worse, and Retrieval refuses it
# once it notices (docs/operations/configuration.md, "Changing the model").
#
# A StatefulSet so a rollout stops the old pod before starting the new one:
# the model cache is ReadWriteOnce.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: primer-embeddings
  labels:
    app: primer-embeddings
spec:
  replicas: 1
  serviceName: primer-embeddings
  selector:
    matchLabels:
      app: primer-embeddings
  template:
    metadata:
      labels:
        app: primer-embeddings
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-server
          # `server-cuda-b11804` (CUDA 12) or `server-cuda13-b11804`
          # (CUDA 13, which a GB10 needs) for an NVIDIA GPU, with a
          # `nvidia.com/gpu: 1` limit below.
          image: ghcr.io/ggml-org/llama.cpp:server-b11804
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - -hf
            - Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
            # The name Primer's `inference.embeddings.model` uses.
            - --alias
            - Qwen/Qwen3-Embedding-0.6B
            # Each of the four slots holds 2048 tokens, the input limit
            # `inference.embeddings.capabilities.maxInputTokens` declares.
            - --kv-unified-per-slot
            - "2048"
            - --parallel
            - "4"
            - --batch-size
            - "2048"
            - --ubatch-size
            - "2048"
            - --embedding
            # Qwen3 embeds from the last token. Mean pooling returns
            # plausible vectors that retrieve badly.
            - --pooling
            - last
          env:
            - name: LLAMA_CACHE
              value: /data
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
          # The first start downloads 640 MB.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: model-cache
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: model-cache
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: your-storage-class
        resources:
          requests:
            storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: primer-embeddings
  labels:
    app: primer-embeddings
spec:
  selector:
    app: primer-embeddings
  ports:
    - name: http
      port: 8080
      targetPort: http
