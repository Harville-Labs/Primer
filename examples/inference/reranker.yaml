---
# The reranker the chart runs as `inference.rerank.bundled`, standing
# alone: llama-server's /rerank with a GGUF of Qwen3-Reranker-0.6B, the
# partner to the embedding model beside it. Qwen publishes it as a causal
# language model that scores by comparing the logits of "yes" and "no";
# llama-server's --reranking understands that shape, which is why it can
# serve this model where a sequence-classifier server cannot.
#
# Its scores are close to binary - a passage that answers the question
# scores near one, others near zero - so an `inference.minScore` set for
# it belongs close to zero, not at a cosine's 0.5.
#
# Reading a shortlist of twenty is about five seconds on fifteen CPU cores
# and milliseconds on a GPU; this is the server to give a GPU first.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: primer-reranker
  labels:
    app: primer-reranker
spec:
  replicas: 1
  serviceName: primer-reranker
  selector:
    matchLabels:
      app: primer-reranker
  template:
    metadata:
      labels:
        app: primer-reranker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-server
          # `server-cuda-b11804` (CUDA 12) or `server-cuda13-b11804`
          # (CUDA 13, which a GB10 needs) for an NVIDIA GPU, with a
          # `nvidia.com/gpu: 1` limit below.
          image: ghcr.io/ggml-org/llama.cpp:server-b11804
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - -hf
            - ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF
            # The name Primer's `inference.rerank.model` uses.
            - --alias
            - Qwen/Qwen3-Reranker-0.6B
            # Each of the four slots holds one question-and-passage pair of
            # up to 2048 tokens. A pair that does not fit fails that
            # search's reranking, which then keeps the vector ordering.
            - --kv-unified-per-slot
            - "2048"
            - --parallel
            - "4"
            - --batch-size
            - "2048"
            - --ubatch-size
            - "2048"
            - --reranking
          env:
            - name: LLAMA_CACHE
              value: /data
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
          # The first start downloads the model.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: model-cache
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: model-cache
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: your-storage-class
        resources:
          requests:
            storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: primer-reranker
  labels:
    app: primer-reranker
spec:
  selector:
    app: primer-reranker
  ports:
    - name: http
      port: 8080
      targetPort: http
