site_name: Primer
site_url: https://isaiah-harville.github.io/Primer/
site_description: Self-hosted, multi-user, and answers only from your own sources, with citations
copyright: Primer is self-hosted software; your documents stay on your infrastructure.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Agent planning notes live under docs/ but are not published: they are
# untracked working material, not documentation for anyone reading this site.
exclude_docs: |
  superpowers/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/contracts/src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/primer.css

nav:
  - Home: index.md
  - User guide:
      - Getting started: guide/getting-started.md
      - Libraries: guide/libraries.md
      - Adding documents: guide/documents.md
      - Supported formats: guide/formats.md
      - When something goes wrong: guide/troubleshooting.md
  - Architecture:
      - Overview: architecture/index.md
      - Ingestion: architecture/ingestion.md
      - Retrieval: architecture/retrieval.md
      - Identity and access: architecture/identity.md
      - Decisions:
          - Index: adr/README.md
          - Reading themes: adr/0001-reading-themes.md
  - Operations:
      - Configuration: operations/configuration.md
      - Choosing models: operations/models.md
      - Deploying: operations/deploying.md
      - Kubernetes: operations/kubernetes.md
      - Migrations: operations/migrations.md
      - Upgrading: operations/upgrading.md
  - Reference:
      - HTTP API: reference/http-api.md
      - Contracts: reference/contracts.md
