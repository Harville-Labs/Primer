[project]
name = "primer-service"
version = "1.4.0"
description = "HTTP plumbing shared by Primer's FastAPI services"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "fastapi",
    "primer-contracts",
    "psycopg[binary]",
    "pydantic",
    "sqlalchemy[asyncio]",
]

[dependency-groups]
dev = [
    "testcontainers[postgres]",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
primer-contracts = { workspace = true }
