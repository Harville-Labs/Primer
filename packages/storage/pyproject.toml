[project]
name = "primer-storage"
version = "0.1.14"
description = "Primer content-addressed source storage, shared by services"
requires-python = ">=3.13"
dependencies = [
    "anyio",
    "fsspec",
    # fsspec dispatches on the URL scheme and imports the backend lazily, so
    # an `s3://` store without this raises ImportError on the first upload
    # rather than at startup. The Kubernetes chart defaults to S3, which made
    # that the default deployment's first upload.
    "s3fs",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
