packages:
  - "apps/*"
  - "packages/*"

# pnpm refuses to run a dependency's install scripts unless it is listed
# here. Declared in the repository rather than approved locally, so the set
# of packages allowed to execute code during install is reviewable and the
# same for every contributor and for CI.
#
# esbuild fetches its platform binary in a postinstall script; Vite cannot
# build without it.
allowBuilds:
  esbuild: true

# The OpenAPI type generator's YAML parser pins js-yaml to a release with a
# fixed HIGH advisory, and CI scans every package in the lockfile, so the
# patch release is forced here. Remove it once @redocly/openapi-core allows
# 4.3.2 or later itself.
overrides:
  js-yaml@4.3.1: 4.3.2
