[project]
name = "primer"
version = "0.1.14"
description = "Self-hosted, multi-user retrieval-augmented search over your own documents"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pyyaml",
    "ruff",
    "ty",
]
docs = [
    "mkdocs<2",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

#: Docling's layout models run on torch. Primer parses documents on CPU, and
#: the default Linux wheels carry a bundled CUDA runtime that is several
#: gigabytes of nothing this deployment uses, so Linux resolves torch from
#: PyTorch's CPU index instead. macOS wheels are already CPU-only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["packages", "services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]
# `token` here is a piece of text a model generated, which S106 reads as a password.
"packages/anomaly/**" = ["S106"]
# A tokenizer's `unk_token` and `eos_token` are vocabulary entries, not passwords.
"services/lab/tests/**" = ["S101", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "integration: needs Docker; runs against a real PostgreSQL container",
    "models: needs network on first run; downloads Docling's layout models",
]

[tool.ty.environment]
python-version = "3.13"
