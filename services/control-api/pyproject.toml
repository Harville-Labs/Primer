[project]
name = "primer-control"
version = "1.0.1"
description = "Primer Control API: public domain operations and authorization"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "asyncpg",
    "celery",
    "fastapi",
    "primer-contracts",
    "primer-observability",
    "primer-service",
    "primer-storage",
    "psycopg[binary]",
    "httpx2",
    "pillow",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy[asyncio]",
]

[dependency-groups]
dev = [
    "testcontainers[postgres]",
]
server = [
    "uvicorn[standard]",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
primer-contracts = { workspace = true }
primer-observability = { workspace = true }
primer-service = { workspace = true }
primer-storage = { workspace = true }
