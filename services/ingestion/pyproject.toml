[project]
name = "primer-ingestion"
version = "0.1.0"
description = "Primer ingestion workers: parsing, chunking, embedding, and indexing"
requires-python = ">=3.13"
dependencies = [
    "celery",
    "docling",
    # Graph extraction, when an operator turns it on: the same client Chat
    # uses for any OpenAI-compatible endpoint, with structured output.
    "haystack-ai",
    "onnxruntime",
    # Imported directly to tell a refused request from an unreachable model,
    # not only reached through Haystack.
    "openai",
    "httpx2",
    "primer-contracts",
    "primer-observability",
    "primer-storage",
    "pydantic-settings",
    # Imported directly by `pictures`, not only reached through Docling.
    # Docling runs OCR in its PDF pipeline alone, so the text inside a
    # slide's pictures is recognized by Primer calling this engine itself -
    # and a dependency that is imported should be declared, rather than
    # relied on to keep arriving underneath something else.
    "rapidocr",
    # Declared directly, though Docling is what needs them, so the workspace
    # can pin them to the CPU-only index. Left transitive, Linux resolves a
    # torch that bundles the entire CUDA toolkit for hardware Primer's
    # document parsing never touches.
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    # Fixture generation only: a .pptx is a ZIP of related OOXML parts, and
    # hand-assembling one would test the generator rather than the parser.
    "python-pptx",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
primer-contracts = { workspace = true }
primer-observability = { workspace = true }
primer-storage = { workspace = true }
